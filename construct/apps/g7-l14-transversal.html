<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>បន្ទាត់ស្របពីរ និងបន្ទាត់កាត់ — ថ្នាក់ទី ៧ · មេរៀនទី ១៤</title>
<style>
/* Reset & Themes */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --orange: #ea580c;
  --orange-soft: #ffedd5;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
  --rose: #e11d48;
  --rose-soft: #ffe4e6;
  
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-full: 9999px;
  
  --font-km: system-ui, "Kantumruy Pro", "Noto Sans Khmer", -apple-system, sans-serif;
  --font-math: "Times New Roman", "STIX Two Text", Georgia, serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17;
    --surface: #131c2e;
    --surface-2: #1e293b;
    --surface-border: #334155;
    --paper-bg: #0d1524;
    --grid-line: #172338;
    --grid-line-major: #22324d;
    
    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --ink-muted: #94a3b8;
    
    --blue: #3b82f6;
    --orange: #fb923c;
    --teal: #14b8a6;
    --teal-soft: rgba(20, 184, 166, 0.15);
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.15);
    --rose: #fb7185;
    --rose-soft: rgba(251, 113, 133, 0.15);
  }
}

[data-theme="dark"] {
  --bg: #090e17;
  --surface: #131c2e;
  --surface-2: #1e293b;
  --surface-border: #334155;
  --paper-bg: #0d1524;
  --grid-line: #172338;
  --grid-line-major: #22324d;
  
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --ink-muted: #94a3b8;
  
  --blue: #3b82f6;
  --orange: #fb923c;
  --teal: #14b8a6;
  --teal-soft: rgba(20, 184, 166, 0.15);
  --green: #22c55e;
  --green-soft: rgba(34, 197, 94, 0.15);
  --rose: #fb7185;
  --rose-soft: rgba(251, 113, 133, 0.15);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --blue: #2563eb;
  --orange: #ea580c;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
  --rose: #e11d48;
  --rose-soft: #ffe4e6;
}

body {
  font-family: var(--font-km);
  background-color: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  line-height: 1.6;
}

.app-container {
  width: 100%;
  max-width: 940px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Header */
.app-header {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title-area {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lesson-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 10px;
  border-radius: var(--radius-full);
  width: fit-content;
}

h1 {
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
}

.theme-btn {
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  color: var(--ink);
  font-size: 16px;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  cursor: pointer;
}

/* 4 Tabs for Angle Types */
.type-tabs {
  display: flex;
  background: var(--surface-2);
  padding: 4px;
  margin: 14px 20px 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
  gap: 4px;
  overflow-x: auto;
}

.type-tab-btn {
  flex: 1 1 0;
  min-width: 135px;
  border: none;
  background: transparent;
  color: var(--ink-secondary);
  font-family: var(--font-km);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  white-space: nowrap;
}

.type-tab-btn.active {
  background: var(--surface);
  color: var(--teal);
  font-weight: 700;
  box-shadow: var(--shadow-sm);
}

/* Rule Card Banner */
.rule-card {
  margin: 12px 20px 0;
  padding: 12px 18px;
  background: var(--teal-soft);
  border: 1px solid var(--teal);
  border-radius: var(--radius);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.rule-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

.rule-sub {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--teal);
}

.options-not-parallel {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  background: var(--surface);
  padding: 4px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--surface-border);
}

.options-not-parallel input {
  accent-color: var(--rose);
  width: 16px;
  height: 16px;
}

/* Canvas Board */
.canvas-wrap {
  padding: 16px 20px;
}

.canvas-board {
  position: relative;
  width: 100%;
  background: var(--paper-bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

svg.cx-svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 840 / 460;
  touch-action: none;
}

/* SVG Typography & Classes */
.cx-label {
  font-family: var(--font-math);
  font-style: italic;
  font-weight: 700;
  font-size: 20px;
  fill: var(--ink);
}

.cx-line-parallel {
  stroke: var(--ink);
  stroke-width: 3.2;
  stroke-linecap: round;
}

.cx-line-transversal {
  stroke: var(--teal);
  stroke-width: 3.8;
  stroke-linecap: round;
}

.handle-pivot {
  fill: var(--teal);
  stroke: #ffffff;
  stroke-width: 2.5;
  cursor: grab;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
}

.handle-pivot:active {
  cursor: grabbing;
}

.parallel-arrow {
  fill: var(--ink-secondary);
}

.arc-highlight-1 {
  fill: rgba(37, 99, 235, 0.22);
  stroke: var(--blue);
  stroke-width: 2.6;
}

.arc-highlight-2 {
  fill: rgba(234, 88, 12, 0.22);
  stroke: var(--orange);
  stroke-width: 2.6;
}

.arc-dimmed {
  fill: rgba(148, 163, 184, 0.08);
  stroke: var(--surface-border);
  stroke-width: 1.2;
}

/* Angle number inside arcs */
.ang-num {
  font-family: var(--font-km);
  font-weight: 700;
  font-size: 15px;
}

/* Controls */
.controls-area {
  padding: 6px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface-2);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
}

.slider-row label {
  font-weight: 700;
  font-size: 14.5px;
  white-space: nowrap;
}

.slider-row input[type="range"] {
  flex-grow: 1;
  accent-color: var(--teal);
  cursor: pointer;
}

.slider-val {
  min-width: 50px;
  font-family: var(--font-math);
  font-weight: 700;
  font-size: 16px;
  text-align: right;
  color: var(--teal);
}

/* Sub-pair picker pills */
.pair-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn-pill {
  padding: 6px 14px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-full);
  font-family: var(--font-km);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-pill:hover {
  background: var(--surface-border);
}

.btn-pill.active {
  background: var(--teal);
  color: #fff;
  border-color: var(--teal);
}

/* Footer */
.app-footer {
  padding: 12px 24px;
  background: var(--surface-2);
  border-top: 1px solid var(--surface-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--ink-muted);
}

@media (max-width: 600px) {
  body { padding: 8px; }
  .app-header { padding: 12px 16px; }
  h1 { font-size: 18px; }
  .type-tabs { margin: 12px 12px 0; }
  .rule-card { margin: 10px 12px 0; padding: 10px 14px; }
  .canvas-wrap { padding: 12px 12px; }
  .controls-area { padding: 4px 12px 14px; }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="title-area">
      <div class="lesson-badge">ថ្នាក់ទី ៧ · មេរៀនទី ១៤ · បន្ទាត់ស្រប បន្ទាត់កែង</div>
      <h1>បន្ទាត់ស្របពីរ និងបន្ទាត់កាត់ (d ∥ d′)</h1>
    </div>

    <button class="theme-btn" id="theme-toggle" title="ប្ដូរផ្ទៃភ្លឺ/ងងឹត" aria-label="ប្ដូរផ្ទៃភ្លឺ ឬងងឹត" onclick="toggleTheme()">
      🌓
    </button>
  </header>

  <!-- 4 Tabs for Angle Relationships -->
  <div class="type-tabs" role="tablist">
    <button type="button" class="type-tab-btn active" id="tab-corr" onclick="switchType('corr')">
      មុំត្រូវគ្នា
    </button>
    <button type="button" class="type-tab-btn" id="tab-alt-int" onclick="switchType('alt-int')">
      មុំឆ្លាស់ក្នុង
    </button>
    <button type="button" class="type-tab-btn" id="tab-alt-ext" onclick="switchType('alt-ext')">
      មុំឆ្លាស់ក្រៅ
    </button>
    <button type="button" class="type-tab-btn" id="tab-co-int" onclick="switchType('co-int')">
      មុំក្នុងរួម
    </button>
  </div>

  <!-- Rule Card Banner -->
  <div class="rule-card">
    <div>
      <div class="rule-title" id="rule-title-text">
        <span>មុំត្រូវគ្នាប៉ុនគ្នា (ស្មើគ្នា) ជានិច្ច ៖</span>
        <b style="color: var(--teal);" id="rule-formula">១ = ៥, ២ = ៦, ៣ = ៧, ៤ = ៨</b>
      </div>
      <div class="rule-sub" id="rule-sub-text">
        គូមុំទាំងពីរសុទ្ធតែមានរង្វាស់ស្មើគ្នា

    <!-- Toggle Non-Parallel Checkbox -->
    <label class="options-not-parallel">

      <span style="color: var(--rose);">បន្ទាត់ពីរមិនស្រប</span>

  <!-- Canvas Board -->
  <main class="canvas-wrap">
    <div class="canvas-board">
      <svg class="cx-svg" id="geometry-svg" viewBox="0 0 840 460" role="img" aria-label="គំនូរបង្ហាញបន្ទាត់ស្របពីរ d និង d' និងបន្ទាត់កាត់ t">
        <defs>

        <rect width="100%" height="100%" fill="url(#grid-pattern-major)" />

        <!-- Parallel Lines d and d' -->

        <g id="layer-handles"></g>

  <!-- Controls Area -->
  <div class="controls-area">
    <!-- Slider for Transversal angle -->
    <div class="slider-row">
      <label for="slider-transversal">បង្វិលបន្ទាត់កាត់ t (៣០° ដល់ ១៥០°) ៖</label>
      <input type="range" id="slider-transversal" min="35" max="145" step="1" value="65" oninput="setAngleTransversal(parseInt(this.value))">
      <span class="slider-val" id="val-slider-t">៦៥°</span>

    <div class="pair-pills" id="pair-pills-container"></div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <span>ប្រភព៖ សៀវភៅគណិតវិទ្យា ថ្នាក់ទី ៧ · មេរៀនទី ១៤</span>
    <span>KhmerMath · បន្ទាត់ស្របនិងបន្ទាត់កាត់</span>

<script>
/**
 * Grade 7 · Lesson 14 · 14-B: Parallels and a Transversal (Angle Pairs)
 */

const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
function toKhmer(num) {
  return String(num).replace(/[0-9]/g, d => khmerDigits[d]);
}

// Geometry configuration
const Y_D = 145; // y coordinate of line d
const Y_D_PRIME = 305; // y coordinate of line d'
const MID_PT = { x: 420, y: 225 }; // midpoint between d and d'

let angleT = 65; // angle of transversal relative to horizontal in deg (acute/obtuse)
let isNotParallel = false;
let tiltDPrime = 0; // if not parallel, tilt of d'

let currentType = 'corr'; // 'corr', 'alt-int', 'alt-ext', 'co-int'
let selectedPairIdx = -1; // -1 means all pairs highlighted, or 0..3

// DOM
const layerParallels = document.getElementById('layer-parallels');
const layerArcs = document.getElementById('layer-arcs');
const layerTransversal = document.getElementById('layer-transversal');
const layerHandles = document.getElementById('layer-handles');
const sliderT = document.getElementById('slider-transversal');
const valSliderT = document.getElementById('val-slider-t');
const ruleTitleText = document.getElementById('rule-title-text');
const ruleFormula = document.getElementById('rule-formula');
const ruleSubText = document.getElementById('rule-sub-text');
const pairPillsContainer = document.getElementById('pair-pills-container');

function createSvgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function createWedge(center, r, degStart, degEnd, className) {
  const rad1 = degStart * Math.PI / 180;
  const rad2 = degEnd * Math.PI / 180;
  const x1 = center.x + r * Math.cos(rad1);
  const y1 = center.y - r * Math.sin(rad1);
  const x2 = center.x + r * Math.cos(rad2);
  const y2 = center.y - r * Math.sin(rad2);
  const largeArc = Math.abs(degEnd - degStart) > 180 ? 1 : 0;
  
  return createSvgEl('path', {
    d: `M ${center.x} ${center.y} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 0 ${x2} ${y2} Z`,
    class: className
  });
}

/**
 * Configure definitions of pairs for each tab
 */
const RELATIONSHIPS = {
  'corr': {
    title: 'មុំត្រូវគ្នាប៉ុនគ្នា (ស្មើគ្នា) ៖',
    formula: '១ = ៥, ២ = ៦, ៣ = ៧, ៤ = ៨',
    sub: 'គូមុំស្ថិតនៅទីតាំងត្រូវគ្នា (មួយខាងលើ មួយខាងក្រោម) លើបន្ទាត់កាត់ t',
    pairs: [
      { name: 'គូ ១ និង ៥', a: 1, b: 5 },
      { name: 'គូ ២ និង ៦', a: 2, b: 6 },
      { name: 'គូ ៣ និង ៧', a: 3, b: 7 },
      { name: 'គូ ៤ និង ៨', a: 4, b: 8 }
    ],
    isEqual: true
  },
  'alt-int': {
    title: 'មុំឆ្លាស់ក្នុងប៉ុនគ្នា (ស្មើគ្នា) ៖',
    formula: '៣ = ៦, ៤ = ៥',
    sub: 'គូមុំស្ថិតនៅខាងក្នុងចន្លោះបន្ទាត់ស្រប និងនៅសងខាងបន្ទាត់កាត់ t',
    pairs: [
      { name: 'គូ ៣ និង ៦', a: 3, b: 6 },
      { name: 'គូ ៤ និង ៥', a: 4, b: 5 }
    ],
    isEqual: true
  },
  'alt-ext': {
    title: 'មុំឆ្លាស់ក្រៅប៉ុនគ្នា (ស្មើគ្នា) ៖',
    formula: '១ = ៨, ២ = ៧',
    sub: 'គូមុំស្ថិតនៅខាងក្រៅបន្ទាត់ស្រប និងនៅសងខាងបន្ទាត់កាត់ t',
    pairs: [
      { name: 'គូ ១ និង ៨', a: 1, b: 8 },
      { name: 'គូ ២ និង ៧', a: 2, b: 7 }
    ],
    isEqual: true
  },
  'co-int': {
    title: 'មុំក្នុងរួមមានផលបូក ១៨០° ៖',
    formula: '៣ + ៥ = ១៨០°, ៤ + ៦ = ១៨០°',
    sub: 'គូមុំស្ថិតនៅខាងក្នុងចន្លោះបន្ទាត់ស្រប និងនៅខាងតែមួយនៃបន្ទាត់កាត់ t',
    pairs: [
      { name: 'គូ ៣ និង ៥', a: 3, b: 5 },
      { name: 'គូ ៤ និង ៦', a: 4, b: 6 }
    ],
    isEqual: false // sum is 180
  }
};

function renderPairPills() {
  pairPillsContainer.innerHTML = '';
  const rel = RELATIONSHIPS[currentType];
  
  // All button
  const btnAll = document.createElement('button');
  btnAll.type = 'button';
  btnAll.className = `btn-pill ${selectedPairIdx === -1 ? 'active' : ''}`;
  btnAll.textContent = 'បង្ហាញទាំងអស់';
  btnAll.onclick = () => { selectedPairIdx = -1; updateScene(); };
  pairPillsContainer.appendChild(btnAll);
  
  // Individual pairs
  rel.pairs.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `btn-pill ${selectedPairIdx === idx ? 'active' : ''}`;
    btn.textContent = p.name;
    btn.onclick = () => { selectedPairIdx = idx; updateScene(); };
    pairPillsContainer.appendChild(btn);
  });
}

function updateScene() {
  layerParallels.innerHTML = '';
  layerArcs.innerHTML = '';
  layerTransversal.innerHTML = '';
  layerHandles.innerHTML = '';
  
  // Math: Transversal line intersects d at A and d' at B
  // Transversal passes through MID_PT (420, 225) with angle angleT
  const radT = angleT * Math.PI / 180;
  
  // Intersection with line d (y = Y_D = 145)
  // dy = Y_D - 225 = -80. dx = dy / (-tan(radT))
  const dyA = Y_D - MID_PT.y;
  const dxA = -dyA / Math.tan(radT);
  const ptA = { x: MID_PT.x + dxA, y: Y_D };
  
  // Intersection with line d'
  let ptB;
  let radDPrime = tiltDPrime * Math.PI / 180;
  if (!isNotParallel) {
    const dyB = Y_D_PRIME - MID_PT.y;
    const dxB = -dyB / Math.tan(radT);
    ptB = { x: MID_PT.x + dxB, y: Y_D_PRIME };
  } else {
    // line d' passes through (420, 305) with slope tan(radDPrime)
    // find intersection with transversal through MID_PT with angleT
    const x0 = MID_PT.x, y0 = MID_PT.y;
    const m1 = -Math.tan(radT);
    const x2 = 420, y2 = Y_D_PRIME;
    const m2 = Math.tan(radDPrime);
    // y - y0 = m1(x - x0); y - y2 = m2(x - x2)
    const intX = (y2 - y0 + m1 * x0 - m2 * x2) / (m1 - m2);
    const intY = y0 + m1 * (intX - x0);
    ptB = { x: intX, y: intY };
  }
  
  // Draw Line d
  layerParallels.appendChild(createSvgEl('line', {
    x1: 80, y1: Y_D, x2: 760, y2: Y_D, class: 'cx-line-parallel'
  }));
  // Arrowheads on line d
  layerParallels.appendChild(createSvgEl('polygon', {
    points: `768,${Y_D} 754,${Y_D-5} 754,${Y_D+5}`, class: 'parallel-arrow'
  }));
  layerParallels.appendChild(createSvgEl('polygon', {
    points: `200,${Y_D} 188,${Y_D-5} 188,${Y_D+5}`, class: 'parallel-arrow'
  }));
  layerParallels.appendChild(createSvgEl('polygon', {
    points: `210,${Y_D} 198,${Y_D-5} 198,${Y_D+5}`, class: 'parallel-arrow'
  }));
  // Label d
  const ld = createSvgEl('text', { x: 775, y: Y_D + 6, class: 'cx-label' });
  ld.textContent = 'd';
  layerParallels.appendChild(ld);
  
  // Draw Line d'
  const dPrimeX1 = 80, dPrimeY1 = isNotParallel ? Y_D_PRIME - 340 * Math.tan(radDPrime) : Y_D_PRIME;
  const dPrimeX2 = 760, dPrimeY2 = isNotParallel ? Y_D_PRIME + 340 * Math.tan(radDPrime) : Y_D_PRIME;
  layerParallels.appendChild(createSvgEl('line', {
    x1: dPrimeX1, y1: dPrimeY1, x2: dPrimeX2, y2: dPrimeY2, class: 'cx-line-parallel'
  }));
  layerParallels.appendChild(createSvgEl('polygon', {
    points: `${dPrimeX2+8},${dPrimeY2} ${dPrimeX2-6},${dPrimeY2-5} ${dPrimeX2-6},${dPrimeY2+5}`, class: 'parallel-arrow'
  }));
  if (!isNotParallel) {
    layerParallels.appendChild(createSvgEl('polygon', {
      points: `200,${Y_D_PRIME} 188,${Y_D_PRIME-5} 188,${Y_D_PRIME+5}`, class: 'parallel-arrow'
    }));
    layerParallels.appendChild(createSvgEl('polygon', {
      points: `210,${Y_D_PRIME} 198,${Y_D_PRIME-5} 198,${Y_D_PRIME+5}`, class: 'parallel-arrow'
    }));
  }
  const ldPrime = createSvgEl('text', { x: 775, y: dPrimeY2 + 6, class: 'cx-label' });
  ldPrime.textContent = 'd′';
  layerParallels.appendChild(ldPrime);
  
  // Draw Transversal Line t
  const tLen = 220;
  const tx1 = MID_PT.x - tLen * Math.cos(radT);
  const ty1 = MID_PT.y + tLen * Math.sin(radT);
  const tx2 = MID_PT.x + tLen * Math.cos(radT);
  const ty2 = MID_PT.y - tLen * Math.sin(radT);
  
  layerTransversal.appendChild(createSvgEl('line', {
    x1: tx1, y1: ty1, x2: tx2, y2: ty2, class: 'cx-line-transversal'
  }));
  // Label t
  const lt = createSvgEl('text', { x: tx2 + 10, y: ty2 + 4, class: 'cx-label', fill: 'var(--teal)' });
  lt.textContent = 't';
  layerTransversal.appendChild(lt);
  
  // Intersection points A and B
  layerHandles.appendChild(createSvgEl('circle', { cx: ptA.x, cy: ptA.y, r: 4.5, fill: 'var(--ink)' }));
  const lA = createSvgEl('text', { x: ptA.x - 18, y: ptA.y - 12, class: 'cx-label' });
  lA.textContent = 'A';
  layerHandles.appendChild(lA);
  
  layerHandles.appendChild(createSvgEl('circle', { cx: ptB.x, cy: ptB.y, r: 4.5, fill: 'var(--ink)' }));
  const lB = createSvgEl('text', { x: ptB.x - 18, y: ptB.y + 22, class: 'cx-label' });
  lB.textContent = 'B';
  layerHandles.appendChild(lB);
  
  // Pivot Handle for student to drag
  const pivotHandle = createSvgEl('circle', {
    id: 'handle-transversal', cx: tx2 - 20 * Math.cos(radT), cy: ty2 + 20 * Math.sin(radT), r: 8, class: 'handle-pivot'
  });
  layerHandles.appendChild(pivotHandle);
  
  // 8 Angles Calculation:
  // Around point A:
  // Angle 1: Top-Right (0 to angleT)
  // Angle 2: Top-Left (angleT to 180)
  // Angle 3: Bottom-Left (180 to 180 + angleT)
  // Angle 4: Bottom-Right (180 + angleT to 360)
  const degA_acute = angleT;
  const degA_obtuse = 180 - angleT;
  
  // Around point B:
  // If parallel: identical!
  // If not parallel: line d' is rotated by tiltDPrime
  const effTiltB = isNotParallel ? tiltDPrime : 0;
  const degB_acute = Math.max(10, Math.min(170, Math.round(angleT - effTiltB)));
  const degB_obtuse = 180 - degB_acute;
  
  const anglesInfo = {
    1: { center: ptA, r: 42, start: 0, end: angleT, val: degA_acute, posAngle: angleT / 2 },
    2: { center: ptA, r: 52, start: angleT, end: 180, val: degA_obtuse, posAngle: (angleT + 180) / 2 },
    3: { center: ptA, r: 42, start: 180, end: 180 + angleT, val: degA_acute, posAngle: 180 + angleT / 2 },
    4: { center: ptA, r: 52, start: 180 + angleT, end: 360, val: degA_obtuse, posAngle: (180 + angleT + 360) / 2 },
    
    5: { center: ptB, r: 42, start: effTiltB, end: angleT, val: degB_acute, posAngle: (effTiltB + angleT) / 2 },
    6: { center: ptB, r: 52, start: angleT, end: 180 + effTiltB, val: degB_obtuse, posAngle: (angleT + 180 + effTiltB) / 2 },
    7: { center: ptB, r: 42, start: 180 + effTiltB, end: 180 + angleT, val: degB_acute, posAngle: (180 + effTiltB + 180 + angleT) / 2 },
    8: { center: ptB, r: 52, start: 180 + angleT, end: 360 + effTiltB, val: degB_obtuse, posAngle: (180 + angleT + 360 + effTiltB) / 2 }
  };
  
  // Highlight active pairs based on currentType and selectedPairIdx
  const rel = RELATIONSHIPS[currentType];
  const activePairList = selectedPairIdx === -1 ? rel.pairs : [rel.pairs[selectedPairIdx]];
  
  const activeNumsA = new Set();
  const activeNumsB = new Set();
  activePairList.forEach(p => {
    activeNumsA.add(p.a);
    activeNumsB.add(p.b);
  });
  
  // Render wedges
  for (let num = 1; num <= 8; num++) {
    const info = anglesInfo[num];
    let wedgeClass = 'arc-dimmed';
    let textFill = 'var(--ink-muted)';
    
    if (activeNumsA.has(num)) {
      wedgeClass = 'arc-highlight-1';
      textFill = 'var(--blue)';
    } else if (activeNumsB.has(num)) {
      wedgeClass = 'arc-highlight-2';
      textFill = 'var(--orange)';
    }
    
    layerArcs.appendChild(createWedge(info.center, info.r, info.start, info.end, wedgeClass));
    
    // Label for number and value
    const pRad = info.posAngle * Math.PI / 180;
    const dist = info.r + 18;
    const tx = info.center.x + dist * Math.cos(pRad);
    const ty = info.center.y - dist * Math.sin(pRad);
    
    const gText = createSvgEl('g');
    const tNum = createSvgEl('text', {
      x: tx, y: ty - 2, 'text-anchor': 'middle', class: 'ang-num', fill: textFill
    });
    tNum.textContent = toKhmer(num);
    
    const tVal = createSvgEl('text', {
      x: tx, y: ty + 12, 'text-anchor': 'middle', class: 'cx-math-text', fill: textFill, 'font-size': '12px'
    });
    tVal.textContent = `${toKhmer(info.val)}°`;
    
    gText.append(tNum, tVal);
    layerArcs.appendChild(gText);
  }
  
  // Update banner text
  ruleTitleText.innerHTML = `<span>${rel.title}</span>`;
  if (!isNotParallel) {
    ruleFormula.style.color = 'var(--teal)';
    ruleFormula.textContent = rel.formula;
    ruleSubText.textContent = rel.sub;
  } else {
    ruleFormula.style.color = 'var(--rose)';
    ruleFormula.textContent = 'មុំទាំងពីរលែងស្មើគ្នាទៀតហើយ (≠)';
    ruleSubText.innerHTML = '<span style="color: var(--rose); font-weight: 700;">ដោយសារបន្ទាត់ d និង d′ មិនស្របគ្នា ទំនាក់ទំនងមុំទាំងអស់ត្រូវបាត់បង់!</span>';
  }
  
  sliderT.value = angleT;
  valSliderT.textContent = `${toKhmer(angleT)}°`;
  
  initTransversalDrag();
}

function switchType(type) {
  currentType = type;
  selectedPairIdx = -1;
  document.querySelectorAll('.type-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.id === `tab-${type}`);
  });
  renderPairPills();
  updateScene();
}

function setAngleTransversal(deg) {
  angleT = deg;
  updateScene();
}

function toggleNotParallel(checked) {
  isNotParallel = checked;
  tiltDPrime = checked ? 14 : 0;
  updateScene();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let target = current === 'light' ? 'dark' : (current === 'dark' ? 'light' : (prefersDark ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', target);
}

function initTransversalDrag() {
  const svg = document.getElementById('geometry-svg');
  const handle = document.getElementById('handle-transversal');
  if (!handle) return;
  
  let isDragging = false;
  
  function getAngleFromPointer(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX || (e.touches && e.touches[0].clientX);
    pt.y = e.clientY || (e.touches && e.touches[0].clientY);
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    const dx = svgP.x - MID_PT.x;
    const dy = MID_PT.y - svgP.y;
    let ang = Math.atan2(dy, dx) * 180 / Math.PI;
    if (ang < 0) ang += 360;
    if (ang > 180) ang -= 180;
    return Math.max(35, Math.min(145, Math.round(ang)));
  }
  
  handle.onpointerdown = (e) => {
    isDragging = true;
    handle.setPointerCapture(e.pointerId);
  };
  
  svg.onpointermove = (e) => {
    if (!isDragging) return;
    setAngleTransversal(getAngleFromPointer(e));
  };
  
  const endDrag = (e) => {
    if (isDragging) {
      isDragging = false;
      if (e && e.pointerId) {
        try { handle.releasePointerCapture(e.pointerId); } catch(err){}
      }
    }
  };
  svg.onpointerup = endDrag;
  svg.onpointercancel = endDrag;
}

document.addEventListener('DOMContentLoaded', () => {
  renderPairPills();
  updateScene();
});
</script>

<script>
/* in the khmermath.org page: the site's theme, no theme button, the page told the height */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add('embed');
  var st = document.createElement('style');
  st.textContent = '.embed body{min-height:0!important;padding:0!important;background:transparent!important}' +
    '.embed .theme-btn{display:none!important}.embed .lesson-badge{display:none!important}' +
    '.embed .app-container{box-shadow:none!important}.embed .title-area{display:none!important}';
  document.head.appendChild(st);
  addEventListener('DOMContentLoaded', function(){        // a header with nothing left in it goes too
    var h = document.querySelector('.app-header'); if (!h) return;
    var keep = h.querySelectorAll('button:not(.theme-btn), input, select, label');
    if (!keep.length) h.style.display = 'none';
    else h.querySelector('.header-actions') && (h.style.justifyContent = 'flex-start');
  });
  function theme(){ try { var t = localStorage.getItem('km-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
  theme(); addEventListener('storage', theme);
  function post(){ var h = Math.ceil(document.querySelector('.app-container').getBoundingClientRect().height) + 2;
    parent.postMessage({kmFrameH: h}, '*'); }
  addEventListener('load', post); addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.querySelector('.app-container'));
  setInterval(post, 700);
})();
</script>
