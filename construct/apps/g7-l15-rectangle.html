<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>សង់ចតុកោណកែង — ថ្នាក់ទី ៧ · មេរៀនទី ១៥</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-border: #cbd5e1;
  --paper-bg: #fffefa; --grid-line: #e2e8f0; --grid-line-major: #cbd5e1;
  --ink: #0f172a; --ink-secondary: #334155; --ink-muted: #64748b;
  --teal: #0f766e; --teal-soft: #ccfbf1; --blue: #1d4ed8; --blue-soft: #dbeafe;
  --orange: #e8710a; --orange-soft: #ffedd5; --green: #1b8a5a; --green-soft: #d1fae5;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --radius-full: 9999px;
  --font-km: system-ui, "Kantumruy Pro", "Noto Sans Khmer", sans-serif;
  --font-math: "Times New Roman", "STIX Two Text", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17; --surface: #131c2e; --surface-2: #1e293b; --surface-border: #334155;
    --paper-bg: #0d1524; --grid-line: #172338; --grid-line-major: #22324d;
    --ink: #f8fafc; --ink-secondary: #cbd5e1; --ink-muted: #94a3b8;
    --teal: #14b8a6; --teal-soft: rgba(20, 184, 166, 0.15);
    --blue: #3b82f6; --blue-soft: rgba(59, 130, 246, 0.15);
    --orange: #fb923c; --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15);
  }
}
[data-theme="dark"] {
  --bg: #090e17; --surface: #131c2e; --surface-2: #1e293b; --surface-border: #334155;
  --paper-bg: #0d1524; --grid-line: #172338; --grid-line-major: #22324d;
  --ink: #f8fafc; --ink-secondary: #cbd5e1; --ink-muted: #94a3b8;
  --teal: #14b8a6; --teal-soft: rgba(20, 184, 166, 0.15);
  --blue: #3b82f6; --blue-soft: rgba(59, 130, 246, 0.15);
  --orange: #fb923c; --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15);
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-border: #cbd5e1;
  --paper-bg: #fffefa; --grid-line: #e2e8f0; --grid-line-major: #cbd5e1;
  --ink: #0f172a; --ink-secondary: #334155; --ink-muted: #64748b;
  --teal: #0f766e; --teal-soft: #ccfbf1; --blue: #1d4ed8; --blue-soft: #dbeafe;
  --orange: #e8710a; --green: #1b8a5a;
}
body {
  font-family: var(--font-km); background-color: var(--bg); color: var(--ink);
  min-height: 100vh; padding: 16px; display: flex; justify-content: center; align-items: flex-start;
  line-height: 1.6;
}
.app-container {
  width: 100%; max-width: 920px; background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column;
}
.app-header {
  padding: 18px 24px 14px; border-bottom: 1px solid var(--surface-border);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.title-area { display: flex; flex-direction: column; gap: 4px; }
.lesson-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  color: var(--teal); background: var(--teal-soft); padding: 2px 10px; border-radius: var(--radius-full);
  width: fit-content;
}
h1 { font-size: 21px; font-weight: 700; color: var(--ink); }
.theme-btn {
  background: var(--surface-2); border: 1px solid var(--surface-border); color: var(--ink);
  font-size: 16px; width: 36px; height: 36px; border-radius: var(--radius-sm);
  display: grid; place-items: center; cursor: pointer;
}
.instruction-box {
  margin: 16px 20px 0; padding: 14px 18px; background: var(--teal-soft); border: 1px solid var(--teal);
  border-radius: var(--radius); display: flex; align-items: flex-start; gap: 12px; min-height: 68px;
}
.step-indicator-badge {
  background: var(--teal); color: #fff; font-size: 13.5px; font-weight: 700;
  padding: 3px 10px; border-radius: var(--radius-full); white-space: nowrap; flex-shrink: 0;
}
.instruction-text { font-size: 16px; font-weight: 500; color: var(--ink); line-height: 1.55; }
.canvas-wrap { padding: 16px 20px; }
.canvas-board {
  position: relative; width: 100%; background: var(--paper-bg); border: 1px solid var(--surface-border);
  border-radius: var(--radius); box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); overflow: hidden;
}
svg.cx-svg { display: block; width: 100%; height: auto; aspect-ratio: 840 / 460; }
.cx-label { font-family: var(--font-math); font-style: italic; font-weight: 700; font-size: 20px; fill: var(--ink); }
.cx-math-text { font-family: var(--font-km); font-size: 14px; font-weight: 600; fill: var(--ink-secondary); }
.seg-drawn { stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; }
.seg-active { stroke: var(--orange); stroke-width: 3.6; stroke-linecap: round; }
.seg-ray { stroke: var(--ink-muted); stroke-width: 1.8; stroke-dasharray: 6 5; }
.seg-final { stroke: var(--green); stroke-width: 3.8; stroke-linecap: round; }
.seg-diag { stroke: #8b5cf6; stroke-width: 2.5; stroke-dasharray: 6 4; }
.arc-trace { fill: none; stroke: var(--orange); stroke-width: 2.2; stroke-linecap: round; }
.right-mark { fill: none; stroke: var(--teal); stroke-width: 2; }
.tick-mark { stroke: var(--ink-secondary); stroke-width: 2; stroke-linecap: round; }

/* Tools */
.tool-setsquare { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25)); pointer-events: none; }
.sq-body { fill: rgba(254, 243, 199, 0.78); stroke: #d97706; stroke-width: 1.6; }
[data-theme="dark"] .sq-body { fill: rgba(245, 158, 11, 0.35); stroke: #fbbf24; }

.tool-ruler { filter: drop-shadow(0 5px 10px rgba(0,0,0,0.22)); pointer-events: none; }
.ruler-body { fill: rgba(254, 240, 138, 0.85); stroke: #ca8a04; stroke-width: 1.4; }
[data-theme="dark"] .ruler-body { fill: rgba(202, 138, 4, 0.35); stroke: #eab308; }

.tool-compass { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25)); pointer-events: none; }
.c-leg { stroke: #64748b; stroke-width: 3.5; stroke-linecap: round; }
.c-needle { fill: #334155; }
.c-pencil { fill: #ea580c; stroke: #9a3412; stroke-width: 1; }
.c-hinge { fill: #f59e0b; stroke: #b45309; stroke-width: 1.5; }
.c-handle { stroke: #475569; stroke-width: 4; stroke-linecap: round; }

.protractor-plate { fill: rgba(224, 231, 255, 0.75); stroke: #4f46e5; stroke-width: 1.4; }
[data-theme="dark"] .protractor-plate { fill: rgba(79, 70, 229, 0.35); stroke: #818cf8; }

.controls-area { padding: 6px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.buttons-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px;
  border-radius: var(--radius-sm); font-family: var(--font-km); font-size: 15px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent; min-height: 42px; transition: all 0.15s ease;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn-secondary { background: var(--surface-2); color: var(--ink); border-color: var(--surface-border); }
.btn-toggle-diag { background: #ede9fe; color: #6d28d9; border-color: #c4b5fd; }
.btn-toggle-diag.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
[data-theme="dark"] .btn-toggle-diag { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border-color: #7c3aed; }
[data-theme="dark"] .btn-toggle-diag.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
.btn-autoplay.active { background: var(--orange); color: #fff; border-color: var(--orange); }

.steps-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.step-chip {
  flex: 1 1 0; min-width: 100px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm); color: var(--ink-muted); font-family: var(--font-km); font-size: 13.5px;
  font-weight: 600; text-align: center; cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
}
.step-chip.active { background: var(--teal); color: #fff; border-color: var(--teal); box-shadow: var(--shadow-sm); }
.step-chip.completed { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }

.result-banner {
  margin: 0 20px 14px; padding: 12px 18px; background: var(--green-soft); border: 1px solid var(--green);
  border-radius: var(--radius); color: var(--green); font-size: 15.5px; font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.result-badge { background: var(--green); color: #fff; font-size: 13px; padding: 2px 8px; border-radius: var(--radius-full); }
.app-footer {
  padding: 12px 24px; background: var(--surface-2); border-top: 1px solid var(--surface-border);
  display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-muted);
}
</style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div class="title-area">
      <div class="lesson-badge">ថ្នាក់ទី ៧ · មេរៀនទី ១៥ · រូបធរណីមាត្រមានវិមាត្រពីរ</div>
      <h1>សង់ចតុកោណកែង (AD = ៥ cm, AB = ៣,៥ cm)</h1>
    </div>
    <button class="theme-btn" id="theme-toggle" title="ប្ដូរផ្ទៃភ្លឺ/ងងឹត" onclick="toggleTheme()">🌓</button>
  </header>

  <div class="instruction-box" role="region" aria-live="polite">
    <span class="step-indicator-badge" id="step-badge">ជំហានទី ១</span>
    <p class="instruction-text" id="step-text">កំពុងរៀបចំ...</p>
  </div>

  <main class="canvas-wrap">
    <div class="canvas-board">
      <svg class="cx-svg" id="geometry-svg" viewBox="0 0 840 460" role="img" aria-label="គំនូរសង់ចតុកោណកែង">
        <defs>
          <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-line)" stroke-width="1" />
          </pattern>
          <pattern id="grid-pattern-major" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#grid-pattern)" />
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--grid-line-major)" stroke-width="1.2" />
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid-pattern-major)" />

        <!-- Dimension Reference info box -->
        <g id="scale-info" transform="translate(30, 24)">
          <rect width="250" height="42" rx="8" fill="var(--surface)" stroke="var(--surface-border)" stroke-width="1" />
          <text x="14" y="26" class="cx-math-text" font-weight="700" fill="var(--teal)">មាត្រដ្ឋាន ៖ ១ cm = ៥០ px</text>
        </g>

        <!-- Construction layers -->
        <g id="layer-segments"></g>
        <g id="layer-arcs"></g>
        <g id="layer-active"></g>
        <g id="layer-diagonals"></g>
        <g id="layer-protractor" style="display: none;"></g>
        <g id="layer-points"></g>
        <g id="layer-tools"></g>
      </svg>
    </div>
  </main>

  <div class="result-banner" id="result-banner" style="display: none;">
    <span class="result-badge">សរុប / ចម្លើយ</span>
    <span id="result-text">ចតុកោណកែង ABCD មានជ្រុង AD = ៥ cm, AB = ៣,៥ cm មុំទាំង ៤ ជាមុំកែង និងមុំ CAD ≈ ៣៥°</span>
  </div>

  <div class="controls-area">
    <nav class="steps-nav" id="steps-nav" aria-label="បញ្ជីជំហាន"></nav>
    <div class="buttons-row">
      <button type="button" class="btn btn-secondary" id="btn-prev" onclick="prevStep()">◀ ថយក្រោយ</button>
      <button type="button" class="btn btn-primary" id="btn-next" onclick="nextStep()">បន្ទាប់ ▶</button>
      <button type="button" class="btn btn-secondary" id="btn-replay" onclick="replayStep()">🔄 ចាក់ឡើងវិញ</button>
      <button type="button" class="btn btn-secondary" id="btn-reset" onclick="resetConstruction()">↺ ចាប់ផ្ដើមឡើងវិញ</button>
      <button type="button" class="btn btn-secondary btn-autoplay" id="btn-autoplay" onclick="toggleAutoplay()">▶ ស្វ័យប្រវត្តិ</button>
      <button type="button" class="btn btn-toggle-diag" id="btn-diag" onclick="toggleDiagonal()">📐 គូសអង្កត់ទ្រូង</button>
    </div>
  </div>

  <footer class="app-footer">
    <span>ប្រភព៖ សៀវភៅគណិតវិទ្យា ថ្នាក់ទី ៧ · មេរៀនទី ១៥</span>
    <span>រង្វាស់ពិតប្រាកដ (1cm = 50px)</span>
  </footer>
</div>

<script>
const KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
function toKhmer(n) {
  return String(n).replace(/[0-9]/g, d => KHMER_DIGITS[Number(d)]);
}

// Geometry constants: Scale 1 cm = 50 px
// AD = 5 cm = 250 px, AB = 3.5 cm = 175 px
const A = { x: 230, y: 350 };
const D = { x: 230 + 250, y: 350 }; // 480, 350
const B = { x: 230, y: 350 - 175 }; // 230, 175
const C = { x: 230 + 250, y: 350 - 175 }; // 480, 175

const STEPS = [
  {
    num: 1,
    title: 'ជំហានទី ១',
    text: 'ប្រើបន្ទាត់ គូសអង្កត់ AD = ៥ cm (២៥០ px) ធ្វើជាបាតនៃចតុកោណកែង។'
  },
  {
    num: 2,
    title: 'ជំហានទី ២',
    text: 'ដាក់កែងត្រង់ចំណុច A កែងនឹងអង្កត់ AD រួចគូសកន្លះបន្ទាត់កែង Ax ឡើងលើ។'
  },
  {
    num: 3,
    title: 'ជំហានទី ៣',
    text: 'ប្រើដែកឈានចំហកាំ ៣,៥ cm (១៧៥ px) ផ្ចិត A កំណត់ចំណុច B នៅលើកន្លះបន្ទាត់ Ax ដោយ AB = ៣,៥ cm។'
  },
  {
    num: 4,
    title: 'ជំហានទី ៤',
    text: 'ប្រើដែកឈាន ៖ យក D ជាផ្ចិត គូសធ្នូកាំ ៣,៥ cm (= AB) និងយក B ជាផ្ចិត គូសធ្នូកាំ ៥ cm (= AD) ធ្នូទាំងពីរកាត់គ្នាត្រង់ C។'
  },
  {
    num: 5,
    title: 'ជំហានទី ៥',
    text: 'ប្រើបន្ទាត់ភ្ជាប់ BC និង DC គេបានចតុកោណកែង ABCD ពេញលេញ។'
  },
  {
    num: 6,
    title: 'ជំហានទី ៦',
    text: 'ផ្ទៀងផ្ទាត់ដោយកែង ៖ មុំទាំង ៤ ជាមុំកែង ហើយជ្រុងឈមស្របគ្នា និងមានប្រវែងស្មើគ្នារៀងៗខ្លួន។'
  },
  {
    num: 7,
    title: 'ជំហានទី ៧',
    text: 'ចុចប៊ូតុង «គូសអង្កត់ទ្រូង» ដើម្បីគូសអង្កត់ទ្រូង AC និងផ្ទៀងផ្ទាត់រង្វាស់មុំ CAD ≈ ៣៥° ដោយរ៉ាប៉ទ័រ (គណនាជាក់ស្តែង ៣៤,៩៩°)។'
  }
];

let currentStep = 0;
let isAutoplaying = false;
let autoplayTimer = null;
let showDiagonalOverlay = false;

// DOM Elements
const layerSegments = document.getElementById('layer-segments');
const layerArcs = document.getElementById('layer-arcs');
const layerActive = document.getElementById('layer-active');
const layerDiagonals = document.getElementById('layer-diagonals');
const layerProtractor = document.getElementById('layer-protractor');
const layerPoints = document.getElementById('layer-points');
const layerTools = document.getElementById('layer-tools');

const stepBadge = document.getElementById('step-badge');
const stepText = document.getElementById('step-text');
const resultBanner = document.getElementById('result-banner');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnAutoplay = document.getElementById('btn-autoplay');
const btnDiag = document.getElementById('btn-diag');
const stepsNav = document.getElementById('steps-nav');

function createSvgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function drawRightAngleMark(pt, dirX, dirY, size = 16) {
  return createSvgEl('polyline', {
    points: `${pt.x + size * dirX},${pt.y} ${pt.x + size * dirX},${pt.y + size * dirY} ${pt.x},${pt.y + size * dirY}`,
    class: 'right-mark'
  });
}

function buildSetSquareSvg(size = 180) {
  const g = createSvgEl('g', { class: 'tool-setsquare' });
  const d = `M 0 0 L ${size} 0 L 0 ${-size} Z M ${size*0.22} ${-size*0.22} L ${size*0.65} ${-size*0.22} L ${size*0.22} ${-size*0.65} Z`;
  g.appendChild(createSvgEl('path', { d: d, 'fill-rule': 'evenodd', class: 'sq-body' }));
  return g;
}

function buildRulerSvg(lengthPx = 300, cmCount = 6) {
  const g = createSvgEl('g', { class: 'tool-ruler' });
  const h = 42;
  g.appendChild(createSvgEl('rect', { x: 0, y: 0, width: lengthPx, height: h, rx: 4, class: 'ruler-body' }));
  
  const stepPx = lengthPx / cmCount; // 50px = 1cm
  for (let c = 0; c <= cmCount; c++) {
    const x = c * stepPx;
    // cm mark
    g.appendChild(createSvgEl('line', { x1: x, y1: 0, x2: x, y2: 15, stroke: '#854d0e', 'stroke-width': 1.6 }));
    const t = createSvgEl('text', {
      x: x + (c === 0 ? 3 : -3), y: 28, 'font-size': '12px', 'font-family': 'var(--font-km)',
      'font-weight': '700', fill: '#854d0e', 'text-anchor': c === 0 ? 'start' : 'end'
    });
    t.textContent = toKhmer(c);
    g.appendChild(t);

    if (c < cmCount) {
      // half-cm mark
      g.appendChild(createSvgEl('line', { x1: x + stepPx*0.5, y1: 0, x2: x + stepPx*0.5, y2: 10, stroke: '#a16207', 'stroke-width': 1.2 }));
      // mm marks
      for (let mm = 1; mm < 10; mm++) {
        if (mm === 5) continue;
        g.appendChild(createSvgEl('line', { x1: x + (stepPx/10)*mm, y1: 0, x2: x + (stepPx/10)*mm, y2: 6, stroke: '#ca8a04', 'stroke-width': 0.8 }));
      }
    }
  }
  return g;
}

function drawCompassTool(needlePt, pencilPt) {
  const g = createSvgEl('g', { class: 'tool-compass' });
  const nx = needlePt.x, ny = needlePt.y;
  const px = pencilPt.x, py = pencilPt.y;
  const span = Math.hypot(px - nx, py - ny);
  const midX = (nx + px) / 2, midY = (ny + py) / 2;
  const legLen = Math.max(span * 0.7 + 60, 80);
  const perpDist = Math.sqrt(Math.max(legLen * legLen - (span * span) / 4, 100));

  let dx = px - nx, dy = py - ny;
  const dLen = Math.hypot(dx, dy) || 1;
  let normX = dy / dLen, normY = -dx / dLen;
  if (normY > 0) { normX = -normX; normY = -normY; }

  const hx = midX + normX * perpDist;
  const hy = midY + normY * perpDist;
  const hTopX = hx + normX * 30;
  const hTopY = hy + normY * 30;

  g.appendChild(createSvgEl('line', { x1: hx, y1: hy, x2: hTopX, y2: hTopY, class: 'c-handle' }));
  g.appendChild(createSvgEl('line', { x1: hx, y1: hy, x2: nx, y2: ny, class: 'c-leg' }));
  g.appendChild(createSvgEl('circle', { cx: nx, cy: ny, r: 2.8, class: 'c-needle' }));
  g.appendChild(createSvgEl('line', { x1: hx, y1: hy, x2: px, y2: py, class: 'c-leg' }));
  g.appendChild(createSvgEl('circle', { cx: px, cy: py, r: 3.2, class: 'c-pencil' }));
  g.appendChild(createSvgEl('circle', { cx: hx, cy: hy, r: 6.5, class: 'c-hinge' }));

  return g;
}

function buildProtractorSvg(cx, cy, radius = 180) {
  const g = createSvgEl('g', { class: 'protractor-overlay' });
  g.setAttribute('transform', `translate(${cx}, ${cy})`);

  // Semi-circle plate
  g.appendChild(createSvgEl('path', {
    d: `M ${-radius} 0 A ${radius} ${radius} 0 0 1 ${radius} 0 Z`,
    class: 'protractor-plate'
  }));

  // Baseline & Center cross
  g.appendChild(createSvgEl('line', { x1: -radius, y1: 0, x2: radius, y2: 0, stroke: '#4f46e5', 'stroke-width': 1.4 }));
  g.appendChild(createSvgEl('circle', { cx: 0, cy: 0, r: 6, fill: 'none', stroke: '#4f46e5', 'stroke-width': 1.4 }));

  // Angle ticks
  for (let deg = 0; deg <= 180; deg += 5) {
    const rad = (deg * Math.PI) / 180;
    const cosR = Math.cos(rad);
    const sinR = -Math.sin(rad);
    const isMajor = deg % 10 === 0;
    const isSpecial = deg === 35 || deg === 90;
    const tickLen = isSpecial ? 18 : (isMajor ? 14 : 8);

    g.appendChild(createSvgEl('line', {
      x1: radius * cosR, y1: radius * sinR,
      x2: (radius - tickLen) * cosR, y2: (radius - tickLen) * sinR,
      stroke: isSpecial ? '#ea580c' : '#4f46e5',
      'stroke-width': isSpecial ? 2 : (isMajor ? 1.4 : 0.8)
    }));

    if (isMajor || isSpecial) {
      const tx = (radius - 28) * cosR;
      const ty = (radius - 28) * sinR + 4;
      const t = createSvgEl('text', {
        x: tx, y: ty, 'text-anchor': 'middle', 'font-size': isSpecial ? '12px' : '10px',
        'font-family': 'var(--font-km)', 'font-weight': isSpecial ? '700' : '500',
        fill: isSpecial ? '#ea580c' : '#312e81'
      });
      t.textContent = toKhmer(deg) + '°';
      g.appendChild(t);
    }
  }

  // Highlight line at CAD angle (35°)
  const rad35 = (35 * Math.PI) / 180;
  g.appendChild(createSvgEl('line', {
    x1: 0, y1: 0, x2: radius * Math.cos(rad35), y2: -radius * Math.sin(rad35),
    stroke: '#ea580c', 'stroke-width': 2, 'stroke-dasharray': '5 3'
  }));

  return g;
}

function renderScene() {
  layerSegments.innerHTML = '';
  layerArcs.innerHTML = '';
  layerActive.innerHTML = '';
  layerDiagonals.innerHTML = '';
  layerProtractor.innerHTML = '';
  layerProtractor.style.display = 'none';
  layerPoints.innerHTML = '';
  layerTools.innerHTML = '';

  stepBadge.textContent = STEPS[currentStep].title;
  stepText.textContent = STEPS[currentStep].text;
  btnPrev.disabled = currentStep === 0;
  btnNext.disabled = currentStep === STEPS.length - 1;
  resultBanner.style.display = currentStep >= 5 ? 'flex' : 'none';

  // Step navigation chips
  stepsNav.innerHTML = '';
  STEPS.forEach((s, idx) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = `step-chip ${idx === currentStep ? 'active' : ''} ${idx < currentStep ? 'completed' : ''}`;
    chip.textContent = s.title;
    chip.onclick = () => { currentStep = idx; renderScene(); };
    stepsNav.appendChild(chip);
  });

  // Base Point A & D
  function addPoint(pt, name, offX = 0, offY = 24, col = 'var(--ink)') {
    const g = createSvgEl('g');
    g.appendChild(createSvgEl('circle', { cx: pt.x, cy: pt.y, r: 4.5, fill: col }));
    const t = createSvgEl('text', { x: pt.x + offX, y: pt.y + offY, class: 'cx-label', fill: col });
    t.textContent = name;
    g.appendChild(t);
    layerPoints.appendChild(g);
  }

  // STEP 1: Segment AD = 5cm
  if (currentStep === 0) {
    layerActive.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: D.x, y2: D.y, class: 'seg-active' }));
    // Ruler at AD
    const ruler = buildRulerSvg(300, 6);
    ruler.setAttribute('transform', `translate(${A.x}, ${A.y + 6})`);
    layerTools.appendChild(ruler);

    addPoint(A, 'A', -20, 20, 'var(--orange)');
    addPoint(D, 'D', 15, 20, 'var(--orange)');

    const dimText = createSvgEl('text', { x: (A.x + D.x)/2, y: A.y - 12, 'text-anchor': 'middle', class: 'cx-math-text', fill: 'var(--orange)' });
    dimText.textContent = 'AD = ៥ cm (២៥០ px)';
    layerActive.appendChild(dimText);
    return;
  }

  // Base AD permanently drawn
  layerSegments.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: D.x, y2: D.y, class: 'seg-drawn' }));
  addPoint(A, 'A', -20, 20);
  addPoint(D, 'D', 15, 20);

  const dimAd = createSvgEl('text', { x: (A.x + D.x)/2, y: A.y + 24, 'text-anchor': 'middle', class: 'cx-math-text' });
  dimAd.textContent = '៥ cm';
  layerSegments.appendChild(dimAd);

  // STEP 2: Perpendicular at A with set square
  if (currentStep === 1) {
    // Ray Ax
    layerActive.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: A.x, y2: 120, class: 'seg-ray' }));
    const rayLabel = createSvgEl('text', { x: A.x - 16, y: 125, class: 'cx-label', fill: 'var(--ink-muted)' });
    rayLabel.textContent = 'x';
    layerActive.appendChild(rayLabel);

    layerActive.appendChild(drawRightAngleMark(A, 1, -1));

    // Place set square at A
    const sq = buildSetSquareSvg(160);
    sq.setAttribute('transform', `translate(${A.x}, ${A.y})`);
    layerTools.appendChild(sq);
    return;
  }

  // Permanent perpendicular line up to ray
  layerSegments.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: A.x, y2: 130, class: 'seg-ray' }));
  layerSegments.appendChild(drawRightAngleMark(A, 1, -1));

  // STEP 3: Mark B on Ax with compass (radius 3.5cm = 175px)
  if (currentStep === 2) {
    // Compass at A marking arc at B
    layerActive.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, class: 'seg-active' }));
    // Arc cutting Ax at B
    layerArcs.appendChild(createSvgEl('path', {
      d: `M ${B.x - 25} ${B.y + 6} A 175 175 0 0 1 ${B.x + 25} ${B.y - 6}`,
      class: 'arc-trace'
    }));

    addPoint(B, 'B', -22, -4, 'var(--orange)');

    const compass = drawCompassTool(A, B);
    layerTools.appendChild(compass);

    const dimAb = createSvgEl('text', { x: A.x - 18, y: (A.y + B.y)/2 + 4, 'text-anchor': 'end', class: 'cx-math-text', fill: 'var(--orange)' });
    dimAb.textContent = 'AB = ៣,៥ cm';
    layerActive.appendChild(dimAb);
    return;
  }

  // Permanent AB drawn
  layerSegments.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, class: 'seg-drawn' }));
  addPoint(B, 'B', -22, -4);
  const dimAb = createSvgEl('text', { x: A.x - 18, y: (A.y + B.y)/2 + 4, 'text-anchor': 'end', class: 'cx-math-text' });
  dimAb.textContent = '៣,៥ cm';
  layerSegments.appendChild(dimAb);

  // STEP 4: Arcs from D (r=3.5) and B (r=5) intersect at C
  if (currentStep === 3) {
    // Arc from D radius 175 px (3.5cm)
    layerArcs.appendChild(createSvgEl('path', {
      d: `M ${C.x - 30} ${C.y - 15} A 175 175 0 0 1 ${C.x + 30} ${C.y + 20}`,
      class: 'arc-trace'
    }));
    // Arc from B radius 250 px (5cm)
    layerArcs.appendChild(createSvgEl('path', {
      d: `M ${C.x + 15} ${C.y - 30} A 250 250 0 0 1 ${C.x - 15} ${C.y + 30}`,
      class: 'arc-trace'
    }));

    addPoint(C, 'C', 16, -6, 'var(--orange)');

    // Show compass working from D to C
    const compass = drawCompassTool(D, C);
    layerTools.appendChild(compass);
    return;
  }

  // Arcs kept faintly
  layerArcs.appendChild(createSvgEl('path', {
    d: `M ${C.x - 22} ${C.y - 10} A 175 175 0 0 1 ${C.x + 22} ${C.y + 14}`,
    class: 'arc-trace', stroke: 'var(--ink-muted)', opacity: '0.6'
  }));
  layerArcs.appendChild(createSvgEl('path', {
    d: `M ${C.x + 10} ${C.y - 22} A 250 250 0 0 1 ${C.x - 10} ${C.y + 22}`,
    class: 'arc-trace', stroke: 'var(--ink-muted)', opacity: '0.6'
  }));
  addPoint(C, 'C', 16, -6);

  // STEP 5: Join BC and DC with ruler
  if (currentStep === 4) {
    layerActive.appendChild(createSvgEl('line', { x1: B.x, y1: B.y, x2: C.x, y2: C.y, class: 'seg-active' }));
    layerActive.appendChild(createSvgEl('line', { x1: D.x, y1: D.y, x2: C.x, y2: C.y, class: 'seg-active' }));

    const ruler = buildRulerSvg(300, 6);
    ruler.setAttribute('transform', `translate(${B.x}, ${B.y - 44})`);
    layerTools.appendChild(ruler);
    return;
  }

  // Fully joined rectangle
  layerSegments.appendChild(createSvgEl('line', { x1: B.x, y1: B.y, x2: C.x, y2: C.y, class: 'seg-final' }));
  layerSegments.appendChild(createSvgEl('line', { x1: D.x, y1: D.y, x2: C.x, y2: C.y, class: 'seg-final' }));

  // Equal opposite side tick marks
  // AD & BC (double ticks)
  const midAD = (A.x + D.x) / 2;
  layerSegments.appendChild(createSvgEl('line', { x1: midAD - 3, y1: A.y - 6, x2: midAD - 3, y2: A.y + 6, class: 'tick-mark' }));
  layerSegments.appendChild(createSvgEl('line', { x1: midAD + 3, y1: A.y - 6, x2: midAD + 3, y2: A.y + 6, class: 'tick-mark' }));
  const midBC = (B.x + C.x) / 2;
  layerSegments.appendChild(createSvgEl('line', { x1: midBC - 3, y1: B.y - 6, x2: midBC - 3, y2: B.y + 6, class: 'tick-mark' }));
  layerSegments.appendChild(createSvgEl('line', { x1: midBC + 3, y1: B.y - 6, x2: midBC + 3, y2: B.y + 6, class: 'tick-mark' }));

  // AB & DC (single tick)
  const midAB_y = (A.y + B.y) / 2;
  layerSegments.appendChild(createSvgEl('line', { x1: A.x - 6, y1: midAB_y, x2: A.x + 6, y2: midAB_y, class: 'tick-mark' }));
  const midDC_y = (D.y + C.y) / 2;
  layerSegments.appendChild(createSvgEl('line', { x1: D.x - 6, y1: midDC_y, x2: D.x + 6, y2: midDC_y, class: 'tick-mark' }));

  // STEP 6: Right angles check
  if (currentStep >= 5) {
    layerSegments.appendChild(drawRightAngleMark(B, 1, 1));
    layerSegments.appendChild(drawRightAngleMark(C, -1, 1));
    layerSegments.appendChild(drawRightAngleMark(D, -1, -1));

    if (currentStep === 5) {
      // Set square verifying corner B
      const sq = buildSetSquareSvg(120);
      sq.setAttribute('transform', `translate(${B.x}, ${B.y}) rotate(90)`);
      layerTools.appendChild(sq);
    }
  }

  // STEP 7 / DIAGONAL OVERLAY
  if (currentStep === 6 || showDiagonalOverlay) {
    btnDiag.classList.add('active');
    layerDiagonals.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: C.x, y2: C.y, class: 'seg-diag' }));

    // Arc for angle CAD
    layerDiagonals.appendChild(createSvgEl('path', {
      d: `M ${A.x + 60} ${A.y} A 60 60 0 0 0 ${A.x + 60 * Math.cos(35 * Math.PI / 180)} ${A.y - 60 * Math.sin(35 * Math.PI / 180)}`,
      fill: 'none', stroke: '#8b5cf6', 'stroke-width': 2.2
    }));

    const angLabel = createSvgEl('text', {
      x: A.x + 72, y: A.y - 18, class: 'cx-math-text', fill: '#7c3aed', 'font-weight': '700'
    });
    angLabel.textContent = '៣៥°';
    layerDiagonals.appendChild(angLabel);

    // Protractor overlay
    layerProtractor.style.display = 'block';
    layerProtractor.appendChild(buildProtractorSvg(A.x, A.y, 160));
  } else {
    btnDiag.classList.remove('active');
  }
}

function nextStep() {
  if (currentStep < STEPS.length - 1) {
    currentStep++;
    renderScene();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderScene();
  }
}

function replayStep() { renderScene(); }

function resetConstruction() {
  currentStep = 0;
  showDiagonalOverlay = false;
  if (isAutoplaying) toggleAutoplay(false);
  renderScene();
}

function toggleDiagonal() {
  showDiagonalOverlay = !showDiagonalOverlay;
  renderScene();
}

function toggleAutoplay(force) {
  isAutoplaying = force !== undefined ? force : !isAutoplaying;
  if (isAutoplaying) {
    btnAutoplay.classList.add('active');
    btnAutoplay.innerHTML = '⏸ ផ្អាក';
    if (currentStep >= STEPS.length - 1) currentStep = 0;
    renderScene();
    runAutoLoop();
  } else {
    btnAutoplay.classList.remove('active');
    btnAutoplay.innerHTML = '▶ ស្វ័យប្រវត្តិ';
    if (autoplayTimer) clearTimeout(autoplayTimer);
  }
}

function runAutoLoop() {
  if (!isAutoplaying) return;
  autoplayTimer = setTimeout(() => {
    if (!isAutoplaying) return;
    if (currentStep < STEPS.length - 1) {
      nextStep();
      runAutoLoop();
    } else {
      toggleAutoplay(false);
    }
  }, 2800);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', cur === 'light' ? 'dark' : (cur === 'dark' ? 'light' : (prefersDark ? 'light' : 'dark')));
}

document.addEventListener('DOMContentLoaded', () => {
  renderScene();
});
</script>

/* in the khmermath.org page: the site's theme, no theme button, the page told the height */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add('embed');
  var st = document.createElement('style');
  st.textContent = '.embed body{min-height:0!important;padding:0!important;background:transparent!important}' +
    '.embed .theme-btn{display:none!important}.embed .lesson-badge{display:none!important}' +
    '.embed .app-container{box-shadow:none!important}.embed .title-area{display:none!important}';
  document.head.appendChild(st);
  addEventListener('DOMContentLoaded', function(){        // a header with nothing left in it goes too
    var h = document.querySelector('.app-header'); if (!h) return;
    var keep = h.querySelectorAll('button:not(.theme-btn), input, select, label');
    if (!keep.length) h.style.display = 'none';
    else h.querySelector('.header-actions') && (h.style.justifyContent = 'flex-start');
  });
  function theme(){ try { var t = localStorage.getItem('km-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
  theme(); addEventListener('storage', theme);
  function post(){ var h = Math.ceil(document.querySelector('.app-container').getBoundingClientRect().height) + 2;
    parent.postMessage({kmFrameH: h}, '*'); }
  addEventListener('load', post); addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.querySelector('.app-container'));
  setInterval(post, 700);
})();
</script>
