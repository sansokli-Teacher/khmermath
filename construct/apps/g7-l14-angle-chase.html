<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>គណនាមុំ រវាងបន្ទាត់ស្រប — ថ្នាក់ទី ៧ · មេរៀនទី ១៤</title>
<style>
/* CSS Reset & System */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --orange: #ea580c;
  --orange-soft: #ffedd5;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
  
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-full: 9999px;
  
  --font-km: system-ui, "Kantumruy Pro", "Noto Sans Khmer", -apple-system, sans-serif;
  --font-math: "Times New Roman", "STIX Two Text", Georgia, serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17;
    --surface: #131c2e;
    --surface-2: #1e293b;
    --surface-border: #334155;
    --paper-bg: #0d1524;
    --grid-line: #172338;
    --grid-line-major: #22324d;
    
    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --ink-muted: #94a3b8;
    
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, 0.15);
    --orange: #fb923c;
    --orange-soft: rgba(251, 146, 60, 0.15);
    --teal: #14b8a6;
    --teal-soft: rgba(20, 184, 166, 0.15);
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.15);
  }
}

[data-theme="dark"] {
  --bg: #090e17;
  --surface: #131c2e;
  --surface-2: #1e293b;
  --surface-border: #334155;
  --paper-bg: #0d1524;
  --grid-line: #172338;
  --grid-line-major: #22324d;
  
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --ink-muted: #94a3b8;
  
  --blue: #3b82f6;
  --blue-soft: rgba(59, 130, 246, 0.15);
  --orange: #fb923c;
  --orange-soft: rgba(251, 146, 60, 0.15);
  --teal: #14b8a6;
  --teal-soft: rgba(20, 184, 166, 0.15);
  --green: #22c55e;
  --green-soft: rgba(34, 197, 94, 0.15);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --orange: #ea580c;
  --orange-soft: #ffedd5;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
}

body {
  font-family: var(--font-km);
  background-color: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  line-height: 1.6;
}

.app-container {
  width: 100%;
  max-width: 940px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Header */
.app-header {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title-area {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lesson-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 10px;
  border-radius: var(--radius-full);
  width: fit-content;
}

h1 {
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
}

.theme-btn {
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  color: var(--ink);
  font-size: 16px;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  cursor: pointer;
}

/* Step instruction banner */
.instruction-box {
  margin: 16px 20px 0;
  padding: 14px 18px;
  background: var(--teal-soft);
  border: 1px solid var(--teal);
  border-radius: var(--radius);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 68px;
}

.step-indicator-badge {
  background: var(--teal);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}

.instruction-text {
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.55;
  flex-grow: 1;
}

/* Inputs bar */
.angle-inputs-bar {
  margin: 12px 20px 0;
  padding: 10px 18px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.input-group {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14.5px;
  font-weight: 600;
}

.input-group input[type="range"] {
  width: 110px;
  accent-color: var(--teal);
  cursor: pointer;
}

.input-num-badge {
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 700;
  font-family: var(--font-math);
  font-size: 15px;
}

/* Canvas Board */
.canvas-wrap {
  padding: 16px 20px;
}

.canvas-board {
  position: relative;
  width: 100%;
  background: var(--paper-bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

svg.cx-svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 840 / 460;
}

/* SVG Typography & Classes */
.cx-label {
  font-family: var(--font-math);
  font-style: italic;
  font-weight: 700;
  font-size: 21px;
  fill: var(--ink);
}

.cx-math-text {
  font-family: var(--font-km);
  font-size: 15px;
  font-weight: 700;
}

.line-parallel {
  stroke: var(--ink);
  stroke-width: 3.2;
  stroke-linecap: round;
}

.line-segment {
  stroke: var(--ink-secondary);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.line-aux-cp {
  stroke: var(--teal);
  stroke-width: 2.8;
  stroke-dasharray: 6 4;
  stroke-linecap: round;
}

.z-highlight-1 {
  stroke: var(--blue);
  stroke-width: 4.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  opacity: 0.85;
}

.z-highlight-2 {
  stroke: var(--orange);
  stroke-width: 4.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  opacity: 0.85;
}

.arc-1 {
  fill: rgba(37, 99, 235, 0.2);
  stroke: var(--blue);
  stroke-width: 2.4;
}

.arc-2 {
  fill: rgba(234, 88, 12, 0.2);
  stroke: var(--orange);
  stroke-width: 2.4;
}

.arc-total {
  fill: none;
  stroke: var(--green);
  stroke-width: 3;
}

/* Controls */
.controls-area {
  padding: 6px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.buttons-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-family: var(--font-km);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  min-height: 42px;
  user-select: none;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
}

.btn-primary {
  background: var(--teal);
  color: #ffffff;
  border-color: var(--teal);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--ink);
  border-color: var(--surface-border);
}

.btn-autoplay.active {
  background: var(--orange);
  color: #ffffff;
  border-color: var(--orange);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}

.steps-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.step-chip {
  flex: 1 1 0;
  min-width: 120px;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  color: var(--ink-muted);
  font-family: var(--font-km);
  font-size: 13.5px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.step-chip:hover {
  background: var(--surface-border);
  color: var(--ink);
}

.step-chip.active {
  background: var(--teal);
  color: #ffffff;
  border-color: var(--teal);
  box-shadow: var(--shadow-sm);
}

.step-chip.completed {
  color: var(--teal);
  border-color: var(--teal);
  background: var(--teal-soft);
}

/* Result banner */
.result-banner {
  margin: 0 20px 14px;
  padding: 12px 18px;
  background: var(--green-soft);
  border: 1px solid var(--green);
  border-radius: var(--radius);
  color: var(--green);
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

.result-badge {
  background: var(--green);
  color: #ffffff;
  font-size: 13px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

/* Footer */
.app-footer {
  padding: 12px 24px;
  background: var(--surface-2);
  border-top: 1px solid var(--surface-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--ink-muted);
}

@media (max-width: 600px) {
  body { padding: 8px; }
  .app-header { padding: 12px 16px; }
  h1 { font-size: 18px; }
  .instruction-box { margin: 12px 12px 0; padding: 10px 14px; }
  .angle-inputs-bar { margin: 8px 12px 0; padding: 8px 12px; }
  .canvas-wrap { padding: 12px 12px; }
  .controls-area { padding: 4px 12px 14px; }
  .buttons-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn-autoplay { grid-column: span 2; }
  .result-banner { margin: 0 12px 12px; }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="title-area">
      <div class="lesson-badge">ថ្នាក់ទី ៧ · មេរៀនទី ១៤ · បន្ទាត់ស្រប បន្ទាត់កែង</div>
      <h1>គណនាមុំ រវាងបន្ទាត់ស្រប (ACB = A + B)</h1>
    </div>

    <button class="theme-btn" id="theme-toggle" title="ប្ដូរផ្ទៃភ្លឺ/ងងឹត" aria-label="ប្ដូរផ្ទៃភ្លឺ ឬងងឹត" onclick="toggleTheme()">
      🌓
    </button>
  </header>

  <!-- Step instruction banner -->
  <div class="instruction-box" role="region" aria-live="polite">
    <span class="step-indicator-badge" id="step-badge">ជំហានទី ១</span>
    <p class="instruction-text" id="step-text">កំពុងរៀបចំ...</p>
  </div>

  <!-- Interactive Angle Inputs -->
  <div class="angle-inputs-bar">
    <div class="input-group">
      <span>មុំ <var>A</var> ៖</span>
      <input type="range" id="input-angle-a" min="20" max="65" step="1" value="40" oninput="changeAngleA(parseInt(this.value))">
      <span class="input-num-badge" id="badge-val-a" style="background: var(--blue-soft); color: var(--blue);">៤០°</span>
    </div>

    <div class="input-group">
      <span>មុំ <var>B</var> ៖</span>
      <input type="range" id="input-angle-b" min="25" max="75" step="1" value="55" oninput="changeAngleB(parseInt(this.value))">
      <span class="input-num-badge" id="badge-val-b" style="background: var(--orange-soft); color: var(--orange);">៥៥°</span>
    </div>

    <div class="input-group">
      <span>មុំ <var>ACB</var> = <b id="badge-val-total" style="color: var(--green); font-size: 17px;">៩៥°</b></span>
    </div>
  </div>

  <!-- SVG Canvas Board -->
  <main class="canvas-wrap">
    <div class="canvas-board">
      <svg class="cx-svg" id="geometry-svg" viewBox="0 0 840 460" role="img" aria-label="គំនូរបង្ហាញការគណនាមុំរវាងបន្ទាត់ស្របពីរ">
        <defs>
          <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-line)" stroke-width="1" />
          </pattern>
          <pattern id="grid-pattern-major" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#grid-pattern)" />
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--grid-line-major)" stroke-width="1.2" />
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid-pattern-major)" />

        <!-- STATIC PARALLEL LINES d and d' -->
        <g id="layer-parallels">
          <!-- Top line d -->
          <line x1="80" y1="110" x2="760" y2="110" class="line-parallel" />
          <polygon points="770,110 756,105 756,115" fill="var(--ink)" />
          <text x="778" y="116" class="cx-label">d</text>
          <!-- Parallel arrow mark -->
          <polygon points="200,110 188,105 188,115" fill="var(--ink-secondary)" />

          <!-- Bottom line d' -->
          <line x1="80" y1="360" x2="760" y2="360" class="line-parallel" />
          <polygon points="770,360 756,355 756,365" fill="var(--ink)" />
          <text x="778" y="366" class="cx-label">d′</text>
          <!-- Parallel arrow mark -->
          <polygon points="200,360 188,355 188,365" fill="var(--ink-secondary)" />
        </g>

        <!-- HIGHLIGHTS & Z SHAPES LAYER -->
        <g id="layer-highlights"></g>

        <!-- MAIN SEGMENTS AC AND BC -->
        <g id="layer-segments"></g>

        <!-- AUXILIARY LINE CP LAYER (Step 1) -->
        <g id="layer-aux-cp"></g>

        <!-- ARCS & ANGLE LABELS LAYER -->
        <g id="layer-arcs"></g>

        <!-- VERTICES & LABELS -->
        <g id="layer-points"></g>
      </svg>
    </div>
  </main>

  <!-- Result Banner -->
  <div class="result-banner" id="result-banner" style="display: none;">
    <span class="result-badge">សរុប / ចម្លើយ</span>
    <span id="result-text">មុំ ACB = ACP + BCP = ៤០° + ៥៥° = ៩៥°</span>
  </div>

  <!-- Controls -->
  <div class="controls-area">
    <nav class="steps-nav" id="steps-nav" aria-label="បញ្ជីជំហាន"></nav>

    <div class="buttons-row">
      <button type="button" class="btn btn-secondary" id="btn-prev" onclick="prevStep()">◀ ថយក្រោយ</button>
      <button type="button" class="btn btn-primary" id="btn-next" onclick="nextStep()">បន្ទាប់ ▶</button>
      <button type="button" class="btn btn-secondary" id="btn-replay" onclick="replayStep()">🔄 ចាក់ឡើងវិញ</button>
      <button type="button" class="btn btn-secondary" id="btn-reset" onclick="resetConstruction()">↺ ចាប់ផ្ដើមឡើងវិញ</button>
      <button type="button" class="btn btn-secondary btn-autoplay" id="btn-autoplay" onclick="toggleAutoplay()">▶ ស្វ័យប្រវត្តិ</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <span>ប្រភព៖ សៀវភៅគណិតវិទ្យា ថ្នាក់ទី ៧ · មេរៀនទី ១៤</span>
    <span>KhmerMath · គណនាមុំរវាងបន្ទាត់ស្រប</span>
  </footer>
</div>

<script>
/**
 * Grade 7 · Lesson 14 · 14-D: Angle Chasing Between Parallels
 */

const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
function toKhmer(num) {
  return String(num).replace(/[0-9]/g, d => khmerDigits[d]);
}

const Y_D = 110;
const Y_D_PRIME = 360;
const PT_C = { x: 470, y: 235 };

let angleA = 40; // deg
let angleB = 55; // deg
let currentStep = 0;
let isAutoplaying = false;
let autoplayTimer = null;
let animFrameId = null;

// DOM
const layerHighlights = document.getElementById('layer-highlights');
const layerSegments = document.getElementById('layer-segments');
const layerAuxCP = document.getElementById('layer-aux-cp');
const layerArcs = document.getElementById('layer-arcs');
const layerPoints = document.getElementById('layer-points');
const stepBadge = document.getElementById('step-badge');
const stepText = document.getElementById('step-text');
const resultBanner = document.getElementById('result-banner');
const resultText = document.getElementById('result-text');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnAutoplay = document.getElementById('btn-autoplay');
const stepsNav = document.getElementById('steps-nav');
const badgeValA = document.getElementById('badge-val-a');
const badgeValB = document.getElementById('badge-val-b');
const badgeValTotal = document.getElementById('badge-val-total');

function createSvgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function createWedge(center, r, degStart, degEnd, className) {
  const rad1 = degStart * Math.PI / 180;
  const rad2 = degEnd * Math.PI / 180;
  const x1 = center.x + r * Math.cos(rad1);
  const y1 = center.y - r * Math.sin(rad1);
  const x2 = center.x + r * Math.cos(rad2);
  const y2 = center.y - r * Math.sin(rad2);
  const largeArc = Math.abs(degEnd - degStart) > 180 ? 1 : 0;
  
  return createSvgEl('path', {
    d: `M ${center.x} ${center.y} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 0 ${x2} ${y2} Z`,
    class: className
  });
}

function updateStepsContent() {
  const tot = angleA + angleB;
  return [
    {
      num: 1,
      title: 'ជំហានទី ១',
      text: 'តាមចំណុច C គូសបន្ទាត់ជំនួយ CP ស្របនឹងបន្ទាត់ d (រំកិលកែងតាមបន្ទាត់)។ ដូចនេះ CP ក៏ស្របនឹង d′ ដែរ។'
    },
    {
      num: 2,
      title: 'ជំហានទី ២',
      text: `ពិនិត្យមុំ A = ${toKhmer(angleA)}° ៖ មុំ ACP = មុំ A = ${toKhmer(angleA)}° ពីព្រោះជាមុំឆ្លាស់ក្នុង (រវាងបន្ទាត់ស្រប d ∥ CP)។`
    },
    {
      num: 3,
      title: 'ជំហានទី ៣',
      text: `ពិនិត្យមុំ B = ${toKhmer(angleB)}° ៖ មុំ BCP = មុំ B = ${toKhmer(angleB)}° ពីព្រោះជាមុំឆ្លាស់ក្នុង (រវាងបន្ទាត់ស្រប CP ∥ d′)។`
    },
    {
      num: 4,
      title: 'ជំហានទី ៤',
      text: `សន្និដ្ឋាន ៖ មុំ ACB = ACP + BCP = ${toKhmer(angleA)}° + ${toKhmer(angleB)}° = ${toKhmer(tot)}°។`
    }
  ];
}

function renderNavChips() {
  stepsNav.innerHTML = '';
  const steps = updateStepsContent();
  steps.forEach((step, idx) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = `step-chip ${idx === currentStep ? 'active' : ''} ${idx < currentStep ? 'completed' : ''}`;
    chip.textContent = step.title;
    chip.onclick = () => goToStep(idx);
    stepsNav.appendChild(chip);
  });
}

function updateUI() {
  const steps = updateStepsContent();
  const stepData = steps[currentStep];
  stepBadge.textContent = stepData.title;
  stepText.textContent = stepData.text;
  btnPrev.disabled = currentStep === 0;
  btnNext.disabled = currentStep === steps.length - 1;
  
  const tot = angleA + angleB;
  if (currentStep === steps.length - 1) {
    resultBanner.style.display = 'flex';
    resultText.textContent = `មុំ ACB = ACP + BCP = ${toKhmer(angleA)}° + ${toKhmer(angleB)}° = ${toKhmer(tot)}°`;
  } else {
    resultBanner.style.display = 'none';
  }
  
  badgeValA.textContent = `${toKhmer(angleA)}°`;
  badgeValB.textContent = `${toKhmer(angleB)}°`;
  badgeValTotal.textContent = `${toKhmer(tot)}°`;
  
  renderNavChips();
}

/**
 * Render Scene
 */
function renderScene(isAnimated = false) {
  layerHighlights.innerHTML = '';
  layerSegments.innerHTML = '';
  layerAuxCP.innerHTML = '';
  layerArcs.innerHTML = '';
  layerPoints.innerHTML = '';
  updateUI();
  
  // Math for points A and B:
  // dyA = PT_C.y - Y_D = 125 px
  // angle A: segment AC goes down-right with angle angleA from horizontal line d
  // dxA = dyA / tan(angleA)
  const radA = angleA * Math.PI / 180;
  const dxA = (PT_C.y - Y_D) / Math.tan(radA);
  const ptA = { x: Math.max(120, PT_C.x - dxA), y: Y_D };
  
  // angle B: segment BC goes up-right with angle angleB from horizontal line d'
  // dyB = Y_D_PRIME - PT_C.y = 125 px
  // dxB = dyB / tan(angleB)
  const radB = angleB * Math.PI / 180;
  const dxB = (Y_D_PRIME - PT_C.y) / Math.tan(radB);
  const ptB = { x: Math.max(120, PT_C.x - dxB), y: Y_D_PRIME };
  
  // Point P on auxiliary line to the right of C
  const ptP = { x: 740, y: PT_C.y };
  
  // Draw segments AC and BC
  layerSegments.appendChild(createSvgEl('line', {
    x1: ptA.x, y1: ptA.y, x2: PT_C.x, y2: PT_C.y, class: 'line-segment'
  }));
  layerSegments.appendChild(createSvgEl('line', {
    x1: ptB.x, y1: ptB.y, x2: PT_C.x, y2: PT_C.y, class: 'line-segment'
  }));
  
  // Draw Points A, B, C
  layerPoints.appendChild(createSvgEl('circle', { cx: ptA.x, cy: ptA.y, r: 4.5, fill: 'var(--ink)' }));
  layerPoints.appendChild(createSvgEl('text', { x: ptA.x - 18, y: ptA.y - 12, class: 'cx-label' })).textContent = 'A';
  
  layerPoints.appendChild(createSvgEl('circle', { cx: ptB.x, cy: ptB.y, r: 4.5, fill: 'var(--ink)' }));
  layerPoints.appendChild(createSvgEl('text', { x: ptB.x - 18, y: ptB.y + 24, class: 'cx-label' })).textContent = 'B';
  
  layerPoints.appendChild(createSvgEl('circle', { cx: PT_C.x, cy: PT_C.y, r: 5, fill: 'var(--teal)' }));
  layerPoints.appendChild(createSvgEl('text', { x: PT_C.x - 22, y: PT_C.y + 6, class: 'cx-label', fill: 'var(--teal)' })).textContent = 'C';
  
  // Base arc for angle A at vertex A (pointing down-right, angle 360 - angleA to 360)
  layerArcs.appendChild(createWedge(ptA, 42, 360 - angleA, 360, 'arc-1'));
  const tA = createSvgEl('text', {
    x: ptA.x + 58, y: ptA.y + 20, class: 'cx-math-text', fill: 'var(--blue)'
  });
  tA.textContent = `${toKhmer(angleA)}°`;
  layerArcs.appendChild(tA);
  
  // Base arc for angle B at vertex B (pointing up-right, angle 0 to angleB)
  layerArcs.appendChild(createWedge(ptB, 42, 0, angleB, 'arc-2'));
  const tB = createSvgEl('text', {
    x: ptB.x + 58, y: ptB.y - 10, class: 'cx-math-text', fill: 'var(--orange)'
  });
  tB.textContent = `${toKhmer(angleB)}°`;
  layerArcs.appendChild(tB);
  
  if (currentStep >= 0) {
    // Auxiliary line CP
    layerAuxCP.appendChild(createSvgEl('line', {
      x1: PT_C.x, y1: PT_C.y, x2: ptP.x, y2: ptP.y, class: 'line-aux-cp'
    }));
    layerAuxCP.appendChild(createSvgEl('polygon', {
      points: `${ptP.x+8},${ptP.y} ${ptP.x-6},${ptP.y-5} ${ptP.x-6},${ptP.y+5}`, fill: 'var(--teal)'
    }));
    layerAuxCP.appendChild(createSvgEl('text', { x: ptP.x + 14, y: ptP.y + 6, class: 'cx-label', fill: 'var(--teal)' })).textContent = 'P';
  }
  
  if (currentStep === 1) {
    // STEP 2: Highlight Upper Alternate Interior Z (d -> AC -> CP)
    layerHighlights.appendChild(createSvgEl('polyline', {
      points: `${ptA.x-100},${ptA.y} ${ptA.x},${ptA.y} ${PT_C.x},${PT_C.y} ${ptP.x},${ptP.y}`,
      class: 'z-highlight-1'
    }));
    
    // Wedge at C for angle ACP: angle (180 - angleA) to 180 (relative to left) or 180 - angleA
    // Since CP is horizontal right (0 deg) and CA is up-left (180 - angleA):
    // Angle ACP is from 0 to angleA (above CP towards CA? No, CA is up-left, so CA angle is 180 - angleA)
    // At vertex C, CA is heading towards top-left, angle 180 - angleA
    // So angle from CP (horizontal right, 0 deg) to CA (towards A) is 180 - angleA?
    // Wait: vector C -> A has dx = ptA.x - PT_C.x < 0, dy = Y_D - PT_C.y < 0 (heading up-left).
    // So angle is 180 - angleA.
    // Therefore angle between CA and CP is angleA!
    layerArcs.appendChild(createWedge(PT_C, 46, 180 - angleA, 180, 'arc-1'));
    const tACP = createSvgEl('text', {
      x: PT_C.x - 30, y: PT_C.y - 30, class: 'cx-math-text', fill: 'var(--blue)'
    });
    tACP.textContent = `${toKhmer(angleA)}°`;
    layerArcs.appendChild(tACP);
  }
  
  else if (currentStep === 2) {
    // STEP 3: Highlight Lower Alternate Interior Z (CP -> CB -> d')
    layerHighlights.appendChild(createSvgEl('polyline', {
      points: `${ptP.x},${ptP.y} ${PT_C.x},${PT_C.y} ${ptB.x},${ptB.y} ${ptB.x-100},${ptB.y}`,
      class: 'z-highlight-2'
    }));
    
    // Wedge at C for angle BCP:
    layerArcs.appendChild(createWedge(PT_C, 46, 180, 180 + angleB, 'arc-2'));
    const tBCP = createSvgEl('text', {
      x: PT_C.x - 30, y: PT_C.y + 40, class: 'cx-math-text', fill: 'var(--orange)'
    });
    tBCP.textContent = `${toKhmer(angleB)}°`;
    layerArcs.appendChild(tBCP);
  }
  
  else if (currentStep === 3) {
    // STEP 4: Total angle ACB
    layerArcs.appendChild(createWedge(PT_C, 46, 180 - angleA, 180, 'arc-1'));
    layerArcs.appendChild(createWedge(PT_C, 46, 180, 180 + angleB, 'arc-2'));
    
    // Green total arc around ACB
    const rTot = 68;
    const radCA = (180 - angleA) * Math.PI / 180;
    const radCB = (180 + angleB) * Math.PI / 180;
    const pCAx = PT_C.x + rTot * Math.cos(radCA), pCAy = PT_C.y - rTot * Math.sin(radCA);
    const pCBx = PT_C.x + rTot * Math.cos(radCB), pCBy = PT_C.y - rTot * Math.sin(radCB);
    
    layerArcs.appendChild(createSvgEl('path', {
      d: `M ${pCAx} ${pCAy} A ${rTot} ${rTot} 0 0 1 ${pCBx} ${pCBy}`,
      class: 'arc-total'
    }));
    
    const tot = angleA + angleB;
    const tTot = createSvgEl('text', {
      x: PT_C.x - 85, y: PT_C.y + 6, class: 'cx-math-text', fill: 'var(--green)', 'font-size': '18px'
    });
    tTot.textContent = `${toKhmer(tot)}°`;
    layerArcs.appendChild(tTot);
  }
}

function changeAngleA(val) {
  angleA = val;
  renderScene(false);
}

function changeAngleB(val) {
  angleB = val;
  renderScene(false);
}

function nextStep() {
  const steps = updateStepsContent();
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderScene(true);
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderScene(false);
  }
}

function replayStep() {
  renderScene(true);
}

function resetConstruction() {
  currentStep = 0;
  if (isAutoplaying) toggleAutoplay(false);
  renderScene(true);
}

function goToStep(idx) {
  currentStep = idx;
  renderScene(true);
}

function handleAutoplayNext() {
  if (!isAutoplaying) return;
  if (autoplayTimer) clearTimeout(autoplayTimer);
  const steps = updateStepsContent();
  autoplayTimer = setTimeout(() => {
    if (!isAutoplaying) return;
    if (currentStep < steps.length - 1) nextStep();
    else toggleAutoplay(false);
  }, 2600);
}

function toggleAutoplay(forceState) {
  isAutoplaying = forceState !== undefined ? forceState : !isAutoplaying;
  const steps = updateStepsContent();
  if (isAutoplaying) {
    btnAutoplay.classList.add('active');
    btnAutoplay.innerHTML = '⏸ ផ្អាក';
    if (currentStep >= steps.length - 1) currentStep = 0;
    renderScene(true);
  } else {
    btnAutoplay.classList.remove('active');
    btnAutoplay.innerHTML = '▶ ស្វ័យប្រវត្តិ';
    if (autoplayTimer) clearTimeout(autoplayTimer);
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let target = current === 'light' ? 'dark' : (current === 'dark' ? 'light' : (prefersDark ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', target);
}

document.addEventListener('DOMContentLoaded', () => {
  renderScene(true);
});
</script>

<script>
/* in the khmermath.org page: the site's theme, no theme button, the page told the height */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add('embed');
  var st = document.createElement('style');
  st.textContent = '.embed body{min-height:0!important;padding:0!important;background:transparent!important}' +
    '.embed .theme-btn{display:none!important}.embed .lesson-badge{display:none!important}' +
    '.embed .app-container{box-shadow:none!important}.embed .title-area{display:none!important}';
  document.head.appendChild(st);
  addEventListener('DOMContentLoaded', function(){        // a header with nothing left in it goes too
    var h = document.querySelector('.app-header'); if (!h) return;
    var keep = h.querySelectorAll('button:not(.theme-btn), input, select, label');
    if (!keep.length) h.style.display = 'none';
    else h.querySelector('.header-actions') && (h.style.justifyContent = 'flex-start');
  });
  function theme(){ try { var t = localStorage.getItem('km-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
  theme(); addEventListener('storage', theme);
  function post(){ var h = Math.ceil(document.querySelector('.app-container').getBoundingClientRect().height) + 2;
    parent.postMessage({kmFrameH: h}, '*'); }
  addEventListener('load', post); addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.querySelector('.app-container'));
  setInterval(post, 700);
})();
</script>
