<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>បោះកាក់ និងប្រូបាប — ថ្នាក់ទី ៧ · មេរៀនទី ២០</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-border: #cbd5e1;
  --paper-bg: #fffefa; --grid-line: #e2e8f0; --grid-line-major: #cbd5e1;
  --ink: #0f172a; --ink-secondary: #334155; --ink-muted: #64748b;
  --teal: #0f766e; --teal-soft: #ccfbf1; --blue: #1d4ed8; --blue-soft: #dbeafe;
  --orange: #e8710a; --orange-soft: #ffedd5; --green: #1b8a5a; --green-soft: #d1fae5;
  --purple: #7c3aed; --purple-soft: #ede9fe;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --radius-full: 9999px;
  --font-km: system-ui, "Kantumruy Pro", "Noto Sans Khmer", sans-serif;
  --font-math: "Times New Roman", "STIX Two Text", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17; --surface: #131c2e; --surface-2: #1e293b; --surface-border: #334155;
    --paper-bg: #0d1524; --grid-line: #172338; --grid-line-major: #22324d;
    --ink: #f8fafc; --ink-secondary: #cbd5e1; --ink-muted: #94a3b8;
    --teal: #14b8a6; --teal-soft: rgba(20, 184, 166, 0.15);
    --blue: #3b82f6; --blue-soft: rgba(59, 130, 246, 0.15);
    --orange: #fb923c; --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15);
    --purple: #a78bfa; --purple-soft: rgba(167, 139, 250, 0.15);
  }
}
[data-theme="dark"] {
  --bg: #090e17; --surface: #131c2e; --surface-2: #1e293b; --surface-border: #334155;
  --paper-bg: #0d1524; --grid-line: #172338; --grid-line-major: #22324d;
  --ink: #f8fafc; --ink-secondary: #cbd5e1; --ink-muted: #94a3b8;
  --teal: #14b8a6; --teal-soft: rgba(20, 184, 166, 0.15);
  --blue: #3b82f6; --blue-soft: rgba(59, 130, 246, 0.15);
  --orange: #fb923c; --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15);
  --purple: #a78bfa; --purple-soft: rgba(167, 139, 250, 0.15);
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-border: #cbd5e1;
  --paper-bg: #fffefa; --grid-line: #e2e8f0; --grid-line-major: #cbd5e1;
  --ink: #0f172a; --ink-secondary: #334155; --ink-muted: #64748b;
  --teal: #0f766e; --teal-soft: #ccfbf1; --blue: #1d4ed8; --blue-soft: #dbeafe;
  --orange: #e8710a; --green: #1b8a5a; --purple: #7c3aed;
}
body {
  font-family: var(--font-km); background-color: var(--bg); color: var(--ink);
  min-height: 100vh; padding: 16px; display: flex; justify-content: center; align-items: flex-start;
  line-height: 1.6;
}
.app-container {
  width: 100%; max-width: 920px; background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column;
}
.app-header {
  padding: 18px 24px 14px; border-bottom: 1px solid var(--surface-border);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.title-area { display: flex; flex-direction: column; gap: 4px; }
.lesson-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  color: var(--teal); background: var(--teal-soft); padding: 2px 10px; border-radius: var(--radius-full);
  width: fit-content;
}
h1 { font-size: 21px; font-weight: 700; color: var(--ink); }
.theme-btn {
  background: var(--surface-2); border: 1px solid var(--surface-border); color: var(--ink);
  font-size: 16px; width: 36px; height: 36px; border-radius: var(--radius-sm);
  display: grid; place-items: center; cursor: pointer;
}

/* Slider Bar */
.slider-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  padding: 14px 24px; background: var(--surface-2); border-bottom: 1px solid var(--surface-border);
  gap: 16px;
}
.slider-ctrl { display: flex; align-items: center; gap: 12px; }
.slider-ctrl label { font-size: 15px; font-weight: 600; color: var(--ink); }
.slider-ctrl input[type="range"] { width: 180px; accent-color: var(--teal); cursor: pointer; }
.val-badge {
  display: inline-block; min-width: 50px; text-align: center; padding: 3px 10px;
  background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius-sm);
  color: var(--teal); font-weight: 700; font-family: var(--font-km);
}

.instruction-box {
  margin: 16px 20px 0; padding: 14px 18px; background: var(--teal-soft); border: 1px solid var(--teal);
  border-radius: var(--radius); display: flex; align-items: flex-start; gap: 12px; min-height: 64px;
}
.step-indicator-badge {
  background: var(--teal); color: #fff; font-size: 13.5px; font-weight: 700;
  padding: 3px 10px; border-radius: var(--radius-full); white-space: nowrap; flex-shrink: 0;
}
.instruction-text { font-size: 16px; font-weight: 500; color: var(--ink); line-height: 1.55; }
.canvas-wrap { padding: 16px 20px; }
.canvas-board {
  position: relative; width: 100%; background: var(--paper-bg); border: 1px solid var(--surface-border);
  border-radius: var(--radius); box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); overflow: hidden;
}
svg.cx-svg { display: block; width: 100%; height: auto; aspect-ratio: 840 / 480; }
.cx-label { font-family: var(--font-math); font-style: italic; font-weight: 700; font-size: 20px; fill: var(--ink); }
.cx-math-text { font-family: var(--font-km); font-size: 14px; font-weight: 600; fill: var(--ink-secondary); }

/* Circle & Points */
.locus-circle { fill: none; stroke: var(--blue); stroke-width: 3.2; stroke-linecap: round; }
.locus-point { fill: var(--teal); stroke: #ffffff; stroke-width: 1.5; transition: all 0.15s ease; }
.locus-point.active { fill: var(--orange); r: 6.5; }
.radius-spoke { stroke: rgba(15, 118, 110, 0.25); stroke-width: 1.2; stroke-dasharray: 4 3; }
.active-radius { stroke: var(--orange); stroke-width: 2.2; }

/* Compass tool */
.tool-compass { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25)); pointer-events: none; }
.c-leg { stroke: #64748b; stroke-width: 3.5; stroke-linecap: round; }
.c-needle { fill: #334155; }
.c-pencil { fill: #ea580c; stroke: #9a3412; stroke-width: 1; }
.c-hinge { fill: #f59e0b; stroke: #b45309; stroke-width: 1.5; }
.c-handle { stroke: #475569; stroke-width: 4; stroke-linecap: round; }

/* Small ruler snippet */
.mini-ruler { fill: rgba(254, 240, 138, 0.9); stroke: #ca8a04; stroke-width: 1.2; }

.controls-area { padding: 6px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.buttons-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px;
  border-radius: var(--radius-sm); font-family: var(--font-km); font-size: 15px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent; min-height: 42px; transition: all 0.15s ease;
}
.btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn-secondary { background: var(--surface-2); color: var(--ink); border-color: var(--surface-border); }
.btn-toggle-circle { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }
.btn-toggle-circle.active { background: var(--blue); color: #fff; }
.btn-play.active { background: var(--orange); color: #fff; border-color: var(--orange); }

.result-banner {
  margin: 0 20px 14px; padding: 14px 20px; background: var(--green-soft); border: 1px solid var(--green);
  border-radius: var(--radius); color: var(--green); font-size: 16px; font-weight: 700;
  display: flex; align-items: center; gap: 12px;
}
.result-badge { background: var(--green); color: #fff; font-size: 13px; padding: 3px 10px; border-radius: var(--radius-full); }
.app-footer {
  padding: 12px 24px; background: var(--surface-2); border-top: 1px solid var(--surface-border);
  display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-muted);
}

/* spinner */
.sp-tabs { display:flex; gap:6px; padding:10px 20px 0; flex-wrap:wrap; border-bottom:1px solid var(--surface-border); }
.sp-tab { font-family:var(--font-km); font-size:15px; font-weight:600; padding:9px 16px; min-height:42px; border:1px solid transparent; border-bottom:none; border-radius:10px 10px 0 0; background:transparent; color:var(--ink-secondary); cursor:pointer; }
.sp-tab[aria-selected="true"] { background:var(--surface-2); color:var(--teal); border-color:var(--surface-border); }
.sp-wrap { padding:16px 20px; display:grid; grid-template-columns:minmax(260px,380px) 1fr; gap:18px; align-items:start; }
.sp-board { max-width:400px; margin:0 auto; background:var(--paper-bg); border:1px solid var(--surface-border); border-radius:var(--radius); padding:8px; }
.sp-svg { width:100%; height:auto; display:block; touch-action:manipulation; }
.sp-sector { cursor:pointer; transition:filter .15s; }
.sp-sector:hover { filter:brightness(1.07); }
.sp-pulse { transform-box: fill-box; transform-origin: center; animation: spPulse 1.6s ease-out infinite; }
@keyframes spPulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.45); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sp-pulse { animation: none; } }
.sp-res { margin:10px 0 0; min-height:2.6em; text-align:center; font-size:18px; font-weight:700; color:var(--ink); line-height:1.7; }
.sp-lab { font-family:var(--font-math); font-style:italic; font-weight:700; font-size:26px; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none; paint-order:stroke; stroke:rgba(0,0,0,.25); stroke-width:3px; }
.sp-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; justify-content:center; }
.sp-chip { min-width:42px; min-height:42px; padding:4px 10px; border-radius:10px; border:1.5px solid var(--surface-border); background:var(--surface); color:var(--ink); font-family:var(--font-math); font-style:italic; font-weight:700; font-size:18px; cursor:pointer; }
.sp-chip[aria-pressed="true"] { background:var(--orange-soft); border-color:var(--orange); color:var(--orange); box-shadow:inset 0 0 0 1px var(--orange); }
.sp-side { display:flex; flex-direction:column; gap:12px; min-width:0; }
.sp-card { background:var(--surface-2); border:1px solid var(--surface-border); border-radius:var(--radius); padding:12px 16px; }
.sp-card h3 { margin:0 0 6px; font-size:15px; color:var(--ink-secondary); font-weight:700; }
.sp-presets { display:flex; flex-wrap:wrap; gap:6px; }
.sp-presets .btn { min-height:38px; padding:6px 12px; font-size:14px; }
.sp-line { font-size:16px; line-height:1.9; color:var(--ink); }
.sp-big { font-size:20px; font-weight:700; }
.frac { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 3px; line-height:1.15; }
.frac > span:first-child { border-bottom:1.5px solid currentColor; padding:0 4px; }
.sp-bars { display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; align-items:center; font-size:15px; }
.sp-bar { height:14px; background:var(--grid-line); border-radius:7px; overflow:hidden; position:relative; }
.sp-bar > i { position:absolute; left:0; top:0; bottom:0; background:var(--primary); border-radius:7px; transition:width .25s; }
.sp-bar > i.ev { background:var(--orange); }
.sp-bar > b { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--green); }
.sp-chart { width:100%; height:auto; background:var(--paper-bg); border:1px solid var(--surface-border); border-radius:var(--radius-sm); }
.sp-result { display:inline-block; min-width:2.2em; padding:2px 12px; border-radius:var(--radius-full); background:var(--teal); color:#fff; font-family:var(--font-math); font-style:italic; font-weight:700; }
.sp-n { display:flex; align-items:center; gap:10px; font-weight:600; }
.sp-n input { accent-color:var(--teal); width:160px; }
.sp-n[hidden] { display:none; }
.btn:disabled { opacity:.55; cursor:default; }
html.compact .app-header, html.compact .sp-tabs, html.compact .app-footer { display:none; }
html.compact .app-container { border:none; box-shadow:none; }
html.compact .sp-wrap { padding:8px 4px; grid-template-columns:minmax(220px,330px) 1fr; }
html.compact .instruction-box { margin-top:0; }
html.compact #expcard.empty .sp-bars, html.compact #expcard.empty .sp-chart { display:none; }
@media (max-width:760px) { .sp-wrap { grid-template-columns:1fr; } }
@media (max-width:560px) { html.compact .sp-wrap { grid-template-columns:1fr; } }


/* coin */
.cn-stage { position:relative; height:250px; border-radius:var(--radius); overflow:hidden; cursor:pointer; background:radial-gradient(ellipse at 50% 72%, #5b4a8a 0%, #3f3366 55%, #2c2349 100%); border:1px solid #241c3d; perspective:900px; user-select:none; -webkit-user-select:none; outline:none; }
.cn-stage:focus-visible { box-shadow:0 0 0 3px var(--teal); }
.cn-stage.hit { box-shadow:inset 0 0 0 4px #ffd24a, 0 0 18px rgba(255,210,74,.6); }
.cn-hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:#f1ecff; font-weight:700; font-size:15px; text-shadow:0 1px 3px rgba(0,0,0,.5); pointer-events:none; transition:opacity .3s; }
.cn-cam { position:absolute; left:50%; top:52%; width:0; height:0; transform-style:preserve-3d; transform:rotateX(58deg); }
.cn-slot { position:absolute; left:0; top:0; width:0; height:0; transform-style:preserve-3d; }
.cn-coin { position:absolute; left:-62px; top:-62px; width:124px; height:124px; transform-style:preserve-3d; }
.cn-face, .cn-rim { position:absolute; inset:0; border-radius:50%; }
.cn-face { backface-visibility:hidden; }
.cn-face svg { width:100%; height:100%; display:block; }
.cn-sh { position:absolute; left:-60px; top:-60px; width:120px; height:120px; border-radius:50%; background:rgba(0,0,0,.45); filter:blur(5px); }
html.compact .app-header, html.compact .sp-tabs, html.compact .app-footer { display:none; }
html.compact .app-container { border:none; box-shadow:none; }
html.compact .sp-wrap { padding:8px 4px; grid-template-columns:minmax(220px,330px) 1fr; }
html.compact .instruction-box { margin-top:0; }
html.compact #expcard.empty .sp-bars, html.compact #expcard.empty .sp-chart { display:none; }
@media (max-width:560px) { html.compact .sp-wrap { grid-template-columns:1fr; } }

</style>
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <div class="title-area">
      <div class="lesson-badge">ថ្នាក់ទី ៧ · មេរៀនទី ២០ · ប្រូបាប</div>
      <h1>បោះកាក់ និងប្រូបាប</h1>
    </div>
    <button class="theme-btn" id="theme-toggle" title="ប្ដូរផ្ទៃភ្លឺ/ងងឹត" aria-label="ប្ដូរផ្ទៃភ្លឺ ឬងងឹត" onclick="toggleTheme()">🌓</button>
  </header>

  <div class="sp-tabs" role="tablist" aria-label="ចំនួនកាក់">
    <button type="button" class="sp-tab" role="tab" id="tab-1" aria-selected="true">កាក់ ១ គ្រាប់</button>
    <button type="button" class="sp-tab" role="tab" id="tab-2" aria-selected="false">កាក់ ២ គ្រាប់</button>
  </div>

  <div class="instruction-box" role="region" aria-live="polite">
    <span class="step-indicator-badge" id="step-badge">វិញ្ញាសា</span>
    <p class="instruction-text" id="step-text"></p>
  </div>

  <div class="sp-wrap">
    <div>
      <div class="cn-stage" id="stage" tabindex="0" role="button" aria-label="ចុចដើម្បីបោះកាក់">
        <div class="cn-cam" id="cam"></div>
        <div class="cn-hint" id="hint">👆 ចុចលើតុ ដើម្បីបោះកាក់</div>
      </div>
      <p class="sp-res" id="res" aria-live="polite"></p>
      <div class="sp-chips" id="chips" role="group" aria-label="លទ្ធផលនៃកាក់"></div>
    </div>

    <div class="sp-side">
      <div class="sp-card">
        <h3>ព្រឹត្តិការណ៍ដែលចង់បាន <span style="font-weight:500">(ជ្រើសប៊ូតុង ឬខាងក្រោមតុ)</span></h3>
        <div class="sp-presets" id="presets"></div>
        <p class="sp-line" id="ev-line"></p>
      </div>
      <div class="sp-card">
        <h3>ប្រូបាបតាមទ្រឹស្តី</h3>
        <p class="sp-line tex" id="prob-line"></p>
      </div>
      <div class="sp-card" id="expcard">
        <h3>លទ្ធផលនៃការពិសោធ</h3>
        <p class="sp-line" id="trial-line"></p>
        <div class="sp-bars" id="bars"></div>
        <svg class="sp-chart" id="chart" viewBox="0 0 420 150" role="img" aria-label="ប្រេកង់ធៀបនៃព្រឹត្តិការណ៍ ខិតចូលជិតប្រូបាប"></svg>
      </div>
    </div>
  </div>

  <div class="controls-area">
    <div class="buttons-row">
      <button type="button" class="btn btn-primary" id="b1">🪙 បោះ ១ ដង</button>
      <button type="button" class="btn btn-secondary" id="b10">បោះ ១០ ដង</button>
      <button type="button" class="btn btn-secondary" id="b100">បោះ ១០០ ដង</button>
      <button type="button" class="btn btn-secondary" id="b1000">បោះ ១ ០០០ ដង</button>
      <button type="button" class="btn btn-secondary" id="breset">↺ សម្អាតលទ្ធផល</button>
    </div>
  </div>

  <footer class="app-footer">
    <span>ប្រភព៖ សៀវភៅគណិតវិទ្យា ថ្នាក់ទី ៧ · មេរៀនទី ២០</span>
    <span>ប្រូបាប = ករណីស្របតាមបំណងប្រាថ្នា ÷ ករណីអាចកើតមានឡើង</span>
  </footer>
</div>

<script>
const KD = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
const kh = n => String(n).replace(/[0-9]/g, d => KD[+d]);
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; if (p) p.appendChild(e); return e; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
/* ---------- sound (made with the Web Audio API; no files) ---------- */
const SND = (function () {
  let ctx = null, on = true, master = null;
  try { on = localStorage.getItem('km-sound') === '1'; } catch (e) { /* no storage */ }
  function ac() {
    if (!on) return null;
    try {
      if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(f, d, v, type, f2) {
    const c = ac(); if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    env(g, t, .004, v, d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);

<script>
/* in the khmermath.org page: the site's theme, no theme button, the page told the height */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add('embed');
  var st = document.createElement('style');
  st.textContent = '.embed body{min-height:0!important;padding:0!important;background:transparent!important}' +
    '.embed .theme-btn{display:none!important}.embed .lesson-badge{display:none!important}' +
    '.embed .app-container{box-shadow:none!important}.embed .title-area{display:none!important}';
  document.head.appendChild(st);
  addEventListener('DOMContentLoaded', function(){        // a header with nothing left in it goes too
    var h = document.querySelector('.app-header'); if (!h) return;
    var keep = h.querySelectorAll('button:not(.theme-btn), input, select, label');
    if (!keep.length) h.style.display = 'none';
    else h.querySelector('.header-actions') && (h.style.justifyContent = 'flex-start');
  });
  function theme(){ try { var t = localStorage.getItem('km-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
  theme(); addEventListener('storage', theme);
  function post(){ var h = Math.ceil(document.querySelector('.app-container').getBoundingClientRect().height) + 2;
    parent.postMessage({kmFrameH: h}, '*'); }
  addEventListener('load', post); addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.querySelector('.app-container'));
  setInterval(post, 700);
})();
</script>
