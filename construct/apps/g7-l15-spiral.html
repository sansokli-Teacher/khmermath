<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>បន្ទាត់កែងជាបន្តបន្ទាប់ — ថ្នាក់ទី ៧ · មេរៀនទី ១៥</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-border: #cbd5e1;
  --paper-bg: #fffefa; --grid-line: #e2e8f0; --grid-line-major: #cbd5e1;
  --ink: #0f172a; --ink-secondary: #334155; --ink-muted: #64748b;
  --teal: #0f766e; --teal-soft: #ccfbf1; --orange: #e8710a; --orange-soft: #ffedd5;
  --green: #1b8a5a; --green-soft: #d1fae5;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --radius-full: 9999px;
  --font-km: system-ui, "Kantumruy Pro", "Noto Sans Khmer", sans-serif;
  --font-math: "Times New Roman", "STIX Two Text", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17; --surface: #131c2e; --surface-2: #1e293b; --surface-border: #334155;
    --paper-bg: #0d1524; --grid-line: #172338; --grid-line-major: #22324d;
    --ink: #f8fafc; --ink-secondary: #cbd5e1; --ink-muted: #94a3b8;
    --teal: #14b8a6; --teal-soft: rgba(20, 184, 166, 0.15);
    --orange: #fb923c; --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15);
  }
}
[data-theme="dark"] {
  --bg: #090e17; --surface: #131c2e; --surface-2: #1e293b; --surface-border: #334155;
  --paper-bg: #0d1524; --grid-line: #172338; --grid-line-major: #22324d;
  --ink: #f8fafc; --ink-secondary: #cbd5e1; --ink-muted: #94a3b8;
  --teal: #14b8a6; --teal-soft: rgba(20, 184, 166, 0.15);
  --orange: #fb923c; --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15);
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-border: #cbd5e1;
  --paper-bg: #fffefa; --grid-line: #e2e8f0; --grid-line-major: #cbd5e1;
  --ink: #0f172a; --ink-secondary: #334155; --ink-muted: #64748b;
  --teal: #0f766e; --teal-soft: #ccfbf1; --orange: #e8710a; --green: #1b8a5a;
}
body {
  font-family: var(--font-km); background-color: var(--bg); color: var(--ink);
  min-height: 100vh; padding: 16px; display: flex; justify-content: center; align-items: flex-start;
  line-height: 1.6;
}
.app-container {
  width: 100%; max-width: 920px; background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column;
}
.app-header {
  padding: 18px 24px 14px; border-bottom: 1px solid var(--surface-border);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.lesson-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  color: var(--teal); background: var(--teal-soft); padding: 2px 10px; border-radius: var(--radius-full);
}
h1 { font-size: 21px; font-weight: 700; color: var(--ink); }
.theme-btn {
  background: var(--surface-2); border: 1px solid var(--surface-border); color: var(--ink);
  font-size: 16px; width: 36px; height: 36px; border-radius: var(--radius-sm);
  display: grid; place-items: center; cursor: pointer;
}
.instruction-box {
  margin: 16px 20px 0; padding: 14px 18px; background: var(--teal-soft); border: 1px solid var(--teal);
  border-radius: var(--radius); display: flex; align-items: flex-start; gap: 12px; min-height: 68px;
}
.step-indicator-badge {
  background: var(--teal); color: #fff; font-size: 13.5px; font-weight: 700;
  padding: 3px 10px; border-radius: var(--radius-full); white-space: nowrap; flex-shrink: 0;
}
.instruction-text { font-size: 16px; font-weight: 500; color: var(--ink); line-height: 1.55; }
.canvas-wrap { padding: 16px 20px; }
.canvas-board {
  position: relative; width: 100%; background: var(--paper-bg); border: 1px solid var(--surface-border);
  border-radius: var(--radius); box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); overflow: hidden;
}
svg.cx-svg { display: block; width: 100%; height: auto; aspect-ratio: 840 / 460; }
.cx-label { font-family: var(--font-math); font-style: italic; font-weight: 700; font-size: 21px; fill: var(--ink); }
.cx-math-text { font-family: var(--font-km); font-size: 14.5px; font-weight: 600; fill: var(--ink-secondary); }
.seg-drawn { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.seg-active { stroke: var(--orange); stroke-width: 3.8; stroke-linecap: round; }
.seg-final { stroke: var(--green); stroke-width: 4; stroke-linecap: round; }
.right-mark { fill: none; stroke: var(--teal); stroke-width: 2.2; }
.tool-setsquare { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25)); pointer-events: none; }
.sq-body { fill: rgba(254, 243, 199, 0.75); stroke: #d97706; stroke-width: 1.6; }
[data-theme="dark"] .sq-body { fill: rgba(245, 158, 11, 0.35); stroke: #fbbf24; }
.controls-area { padding: 6px 20px 16px; display: flex; flex-direction: column; gap: 16px; }
.buttons-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px;
  border-radius: var(--radius-sm); font-family: var(--font-km); font-size: 15px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent; min-height: 42px;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn-secondary { background: var(--surface-2); color: var(--ink); border-color: var(--surface-border); }
.btn-autoplay.active { background: var(--orange); color: #fff; border-color: var(--orange); }
.steps-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.step-chip {
  flex: 1 1 0; min-width: 110px; padding: 8px 10px; background: var(--surface-2);
  border: 1px solid var(--surface-border); border-radius: var(--radius-sm); color: var(--ink-muted);
  font-family: var(--font-km); font-size: 13.5px; font-weight: 600; text-align: center; cursor: pointer; white-space: nowrap;
}
.step-chip.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.step-chip.completed { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }
.result-banner {
  margin: 0 20px 14px; padding: 12px 18px; background: var(--green-soft); border: 1px solid var(--green);
  border-radius: var(--radius); color: var(--green); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px;
}
.result-badge { background: var(--green); color: #fff; font-size: 13px; padding: 2px 8px; border-radius: var(--radius-full); }
.app-footer {
  padding: 12px 24px; background: var(--surface-2); border-top: 1px solid var(--surface-border);
  display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-muted);
}
@media (max-width: 600px) {
  body { padding: 8px; } h1 { font-size: 18px; }
  .canvas-wrap { padding: 12px 12px; } .buttons-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn-autoplay { grid-column: span 2; }
}
</style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div>
      <div class="lesson-badge">ថ្នាក់ទី ៧ · មេរៀនទី ១៥ · រូបធរណីមាត្រមានវិមាត្រពីរ</div>
      <h1>បន្ទាត់កែងជាបន្តបន្ទាប់ (AI ⊥ IJ ⊥ JK ⊥ KL)</h1>
    </div>
    <button class="theme-btn" id="theme-toggle" title="ប្ដូរផ្ទៃ" onclick="toggleTheme()">🌓</button>
  </header>

  <div class="instruction-box" role="region" aria-live="polite">
    <span class="step-indicator-badge" id="step-badge">ជំហានទី ១</span>
    <p class="instruction-text" id="step-text">កំពុងរៀបចំ...</p>
  </div>

  <main class="canvas-wrap">
    <div class="canvas-board">
      <svg class="cx-svg" id="geometry-svg" viewBox="0 0 840 460" role="img" aria-label="គំនូរបន្ទាត់កែងជាបន្តបន្ទាប់">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-line)" stroke-width="1" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
        <g id="layer-segments"></g>
        <g id="layer-active"></g>
        <g id="layer-tool" class="tool-setsquare"></g>
        <g id="layer-points"></g>
      </svg>
    </div>
  </main>

  <div class="result-banner" id="result-banner" style="display: none;">
    <span class="result-badge">សរុប / សន្និដ្ឋាន</span>
    <span>បន្ទាត់ AI, IJ, JK, KL កែងគ្នាជាបន្តបន្ទាប់</span>
  </div>

  <div class="controls-area">
    <nav class="steps-nav" id="steps-nav"></nav>
    <div class="buttons-row">
      <button type="button" class="btn btn-secondary" id="btn-prev" onclick="prevStep()">◀ ថយក្រោយ</button>
      <button type="button" class="btn btn-primary" id="btn-next" onclick="nextStep()">បន្ទាប់ ▶</button>
      <button type="button" class="btn btn-secondary" id="btn-replay" onclick="replayStep()">🔄 ចាក់ឡើងវិញ</button>
      <button type="button" class="btn btn-secondary" id="btn-reset" onclick="resetConstruction()">↺ ចាប់ផ្ដើមឡើងវិញ</button>
      <button type="button" class="btn btn-secondary btn-autoplay" id="btn-autoplay" onclick="toggleAutoplay()">▶ ស្វ័យប្រវត្តិ</button>
    </div>
  </div>

  <footer class="app-footer">
    <span>ប្រភព៖ សៀវភៅគណិតវិទ្យា ថ្នាក់ទី ៧ · មេរៀនទី ១៥</span>
    <span>KhmerMath · បន្ទាត់កែងជាបន្តបន្ទាប់</span>
  </footer>
</div>

<script>
const L = 140; // 3.5 cm in pixels
const A = { x: 350, y: 300 };
const I = { x: A.x + L, y: A.y };
const J = { x: I.x, y: I.y - L };
const K = { x: J.x - L, y: J.y };
const L_pt = { x: K.x, y: K.y + L };

const STEPS = [
  { num: 1, title: 'ជំហានទី ១', text: 'គូសអង្កត់ AI មានប្រវែង ៣ cm (ឬ ៣,៥ cm) ដោយប្រើបន្ទាត់។' },
  { num: 2, title: 'ជំហានទី ២', text: 'ដាក់កែងត្រង់ចំណុច I ឱ្យជ្រុងមុំកែងម្ខាងនៅតាម AI រួចគូសបន្ទាត់កែង IJ = ៣ cm ឡើងលើ (AI ⊥ IJ)។' },
  { num: 3, title: 'ជំហានទី ៣', text: 'ដាក់កែងត្រង់ចំណុច J ឱ្យជ្រុងមុំកែងម្ខាងនៅតាម IJ រួចគូសបន្ទាត់កែង JK = ៣ cm ទៅឆ្វេង (IJ ⊥ JK)។' },
  { num: 4, title: 'ជំហានទី ៤', text: 'ដាក់កែងត្រង់ចំណុច K ឱ្យជ្រុងមុំកែងម្ខាងនៅតាម JK រួចគូសបន្ទាត់កែង KL = ៣ cm ចុះក្រោម (JK ⊥ KL)។' },
  { num: 5, title: 'ជំហានទី ៥', text: 'សន្និដ្ឋាន ៖ បន្ទាត់ AI, IJ, JK, KL កែងគ្នាជាបន្តបន្ទាប់ បង្កើតបានជាទម្រង់រាងការ៉េ។' }
];

let currentStep = 0, isAutoplaying = false, autoplayTimer = null, animFrameId = null;

const layerSegments = document.getElementById('layer-segments');
const layerActive = document.getElementById('layer-active');
const layerTool = document.getElementById('layer-tool');
const layerPoints = document.getElementById('layer-points');
const stepBadge = document.getElementById('step-badge');
const stepText = document.getElementById('step-text');
const resultBanner = document.getElementById('result-banner');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnAutoplay = document.getElementById('btn-autoplay');
const stepsNav = document.getElementById('steps-nav');

function createSvgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function buildSetSquare() {
  const g = createSvgEl('g');
  const size = 160;
  g.appendChild(createSvgEl('path', {
    d: `M 0 0 L ${size} 0 L 0 ${-size} Z M ${size*0.25} ${-size*0.25} L ${size*0.7} ${-size*0.25} L ${size*0.25} ${-size*0.7} Z`,
    'fill-rule': 'evenodd', class: 'sq-body'
  }));
  return g;
}
layerTool.appendChild(buildSetSquare());

function drawRightAngle(pt, dirX, dirY) {
  const s = 18;
  return createSvgEl('polyline', {
    points: `${pt.x + s*dirX},${pt.y} ${pt.x + s*dirX},${pt.y + s*dirY} ${pt.x},${pt.y + s*dirY}`,
    class: 'right-mark'
  });
}

function renderScene() {
  layerSegments.innerHTML = '';
  layerActive.innerHTML = '';
  layerPoints.innerHTML = '';
  layerTool.style.display = 'none';

  stepBadge.textContent = STEPS[currentStep].title;
  stepText.textContent = STEPS[currentStep].text;
  btnPrev.disabled = currentStep === 0;
  btnNext.disabled = currentStep === STEPS.length - 1;
  resultBanner.style.display = currentStep === STEPS.length - 1 ? 'flex' : 'none';

  stepsNav.innerHTML = '';
  STEPS.forEach((s, idx) => {
    const chip = document.createElement('button');
    chip.className = `step-chip ${idx === currentStep ? 'active' : ''} ${idx < currentStep ? 'completed' : ''}`;
    chip.textContent = s.title;
    chip.onclick = () => { currentStep = idx; renderScene(); };
    stepsNav.appendChild(chip);
  });

  // Base AI
  layerSegments.appendChild(createSvgEl('line', { x1: A.x, y1: A.y, x2: I.x, y2: I.y, class: 'seg-drawn' }));
  layerPoints.appendChild(createSvgEl('circle', { cx: A.x, cy: A.y, r: 4.5, fill: 'var(--ink)' }));
  layerPoints.appendChild(createSvgEl('text', { x: A.x - 18, y: A.y + 18, class: 'cx-label' })).textContent = 'A';
  layerPoints.appendChild(createSvgEl('circle', { cx: I.x, cy: I.y, r: 4.5, fill: 'var(--ink)' }));
  layerPoints.appendChild(createSvgEl('text', { x: I.x + 12, y: I.y + 18, class: 'cx-label' })).textContent = 'I';

  if (currentStep === 1) {
    // Tool at I rotated 0 deg
    layerTool.style.display = 'block';
    layerTool.setAttribute('transform', `translate(${I.x}, ${I.y}) rotate(0) scale(-1, 1)`);
    layerActive.appendChild(createSvgEl('line', { x1: I.x, y1: I.y, x2: J.x, y2: J.y, class: 'seg-active' }));
    layerActive.appendChild(drawRightAngle(I, -1, -1));
    layerPoints.appendChild(createSvgEl('circle', { cx: J.x, cy: J.y, r: 4.5, fill: 'var(--orange)' }));
    layerPoints.appendChild(createSvgEl('text', { x: J.x + 12, y: J.y - 8, class: 'cx-label' })).textContent = 'J';
  } else if (currentStep >= 2) {
    layerSegments.appendChild(createSvgEl('line', { x1: I.x, y1: I.y, x2: J.x, y2: J.y, class: 'seg-drawn' }));
    layerSegments.appendChild(drawRightAngle(I, -1, -1));
    layerPoints.appendChild(createSvgEl('circle', { cx: J.x, cy: J.y, r: 4.5, fill: 'var(--ink)' }));
    layerPoints.appendChild(createSvgEl('text', { x: J.x + 12, y: J.y - 8, class: 'cx-label' })).textContent = 'J';
  }

  if (currentStep === 2) {
    layerTool.style.display = 'block';
    layerTool.setAttribute('transform', `translate(${J.x}, ${J.y}) rotate(90) scale(1, -1)`);
    layerActive.appendChild(createSvgEl('line', { x1: J.x, y1: J.y, x2: K.x, y2: K.y, class: 'seg-active' }));
    layerActive.appendChild(drawRightAngle(J, -1, 1));
    layerPoints.appendChild(createSvgEl('circle', { cx: K.x, cy: K.y, r: 4.5, fill: 'var(--orange)' }));
    layerPoints.appendChild(createSvgEl('text', { x: K.x - 18, y: K.y - 8, class: 'cx-label' })).textContent = 'K';
  } else if (currentStep >= 3) {
    layerSegments.appendChild(createSvgEl('line', { x1: J.x, y1: J.y, x2: K.x, y2: K.y, class: 'seg-drawn' }));
    layerSegments.appendChild(drawRightAngle(J, -1, 1));
    layerPoints.appendChild(createSvgEl('circle', { cx: K.x, cy: K.y, r: 4.5, fill: 'var(--ink)' }));
    layerPoints.appendChild(createSvgEl('text', { x: K.x - 18, y: K.y - 8, class: 'cx-label' })).textContent = 'K';
  }

  if (currentStep === 3) {
    layerTool.style.display = 'block';
    layerTool.setAttribute('transform', `translate(${K.x}, ${K.y}) rotate(180)`);
    layerActive.appendChild(createSvgEl('line', { x1: K.x, y1: K.y, x2: L_pt.x, y2: L_pt.y, class: 'seg-active' }));
    layerActive.appendChild(drawRightAngle(K, 1, 1));
    layerPoints.appendChild(createSvgEl('circle', { cx: L_pt.x, cy: L_pt.y, r: 4.5, fill: 'var(--orange)' }));
    layerPoints.appendChild(createSvgEl('text', { x: L_pt.x - 18, y: L_pt.y + 18, class: 'cx-label' })).textContent = 'L';
  } else if (currentStep === 4) {
    layerSegments.appendChild(createSvgEl('line', { x1: K.x, y1: K.y, x2: L_pt.x, y2: L_pt.y, class: 'seg-final' }));
    layerSegments.appendChild(drawRightAngle(K, 1, 1));
    layerPoints.appendChild(createSvgEl('circle', { cx: L_pt.x, cy: L_pt.y, r: 4.5, fill: 'var(--green)' }));
    layerPoints.appendChild(createSvgEl('text', { x: L_pt.x - 18, y: L_pt.y + 18, class: 'cx-label', fill: 'var(--green)' })).textContent = 'L';
  }
}

function nextStep() { if (currentStep < STEPS.length - 1) { currentStep++; renderScene(); } }
function prevStep() { if (currentStep > 0) { currentStep--; renderScene(); } }
function replayStep() { renderScene(); }
function resetConstruction() { currentStep = 0; if (isAutoplaying) toggleAutoplay(false); renderScene(); }

function toggleAutoplay(force) {
  isAutoplaying = force !== undefined ? force : !isAutoplaying;
  if (isAutoplaying) {
    btnAutoplay.classList.add('active'); btnAutoplay.innerHTML = '⏸ ផ្អាក';
    if (currentStep >= STEPS.length - 1) currentStep = 0;
    renderScene();
    runAutoLoop();
  } else {
    btnAutoplay.classList.remove('active'); btnAutoplay.innerHTML = '▶ ស្វ័យប្រវត្តិ';
    if (autoplayTimer) clearTimeout(autoplayTimer);
  }
}

function runAutoLoop() {
  if (!isAutoplaying) return;
  autoplayTimer = setTimeout(() => {
    if (!isAutoplaying) return;
    if (currentStep < STEPS.length - 1) { nextStep(); runAutoLoop(); }
    else toggleAutoplay(false);
  }, 2600);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', cur === 'light' ? 'dark' : (cur === 'dark' ? 'light' : (prefersDark ? 'light' : 'dark')));
}

document.addEventListener('DOMContentLoaded', () => { renderScene(); });
</script>

<script>
/* in the khmermath.org page: the site's theme, no theme button, the page told the height */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add('embed');
  var st = document.createElement('style');
  st.textContent = '.embed body{min-height:0!important;padding:0!important;background:transparent!important}' +
    '.embed .theme-btn{display:none!important}.embed .lesson-badge{display:none!important}' +
    '.embed .app-container{box-shadow:none!important}.embed .title-area{display:none!important}';
  document.head.appendChild(st);
  addEventListener('DOMContentLoaded', function(){        // a header with nothing left in it goes too
    var h = document.querySelector('.app-header'); if (!h) return;
    var keep = h.querySelectorAll('button:not(.theme-btn), input, select, label');
    if (!keep.length) h.style.display = 'none';
    else h.querySelector('.header-actions') && (h.style.justifyContent = 'flex-start');
  });
  function theme(){ try { var t = localStorage.getItem('km-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
  theme(); addEventListener('storage', theme);
  function post(){ var h = Math.ceil(document.querySelector('.app-container').getBoundingClientRect().height) + 2;
    parent.postMessage({kmFrameH: h}, '*'); }
  addEventListener('load', post); addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.querySelector('.app-container'));
  setInterval(post, 700);
})();
</script>
</body>
</html>
