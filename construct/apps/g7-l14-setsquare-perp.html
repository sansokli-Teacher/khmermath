<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>គូសបន្ទាត់កែង ដោយប្រើកែង — ថ្នាក់ទី ៧ · មេរៀនទី ១៤</title>
<style>
/* Reset & CSS Theme */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --orange: #e8710a;
  --orange-soft: #ffedd5;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
  --amber: #d97706;
  
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-full: 9999px;
  
  --font-km: system-ui, "Kantumruy Pro", "Noto Sans Khmer", -apple-system, sans-serif;
  --font-math: "Times New Roman", "STIX Two Text", Georgia, serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17;
    --surface: #131c2e;
    --surface-2: #1e293b;
    --surface-border: #334155;
    --paper-bg: #0d1524;
    --grid-line: #172338;
    --grid-line-major: #22324d;
    
    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --ink-muted: #94a3b8;
    
    --teal: #14b8a6;
    --teal-soft: rgba(20, 184, 166, 0.15);
    --orange: #fb923c;
    --orange-soft: rgba(251, 146, 60, 0.15);
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.15);
  }
}

[data-theme="dark"] {
  --bg: #090e17;
  --surface: #131c2e;
  --surface-2: #1e293b;
  --surface-border: #334155;
  --paper-bg: #0d1524;
  --grid-line: #172338;
  --grid-line-major: #22324d;
  
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --ink-muted: #94a3b8;
  
  --teal: #14b8a6;
  --teal-soft: rgba(20, 184, 166, 0.15);
  --orange: #fb923c;
  --orange-soft: rgba(251, 146, 60, 0.15);
  --green: #22c55e;
  --green-soft: rgba(34, 197, 94, 0.15);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --orange: #e8710a;
  --orange-soft: #ffedd5;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
}

body {
  font-family: var(--font-km);
  background-color: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  line-height: 1.6;
}

.app-container {
  width: 100%;
  max-width: 920px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Header */
.app-header {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title-area {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lesson-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 10px;
  border-radius: var(--radius-full);
  width: fit-content;
}

h1 {
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
}

.theme-btn {
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  color: var(--ink);
  font-size: 16px;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  cursor: pointer;
}

/* Instruction Banner */
.instruction-box {
  margin: 16px 20px 0;
  padding: 14px 18px;
  background: var(--teal-soft);
  border: 1px solid var(--teal);
  border-radius: var(--radius);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 68px;
}

.step-indicator-badge {
  background: var(--teal);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}

.instruction-text {
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.55;
  flex-grow: 1;
}

/* Canvas Board */
.canvas-wrap {
  padding: 16px 20px;
}

.canvas-board {
  position: relative;
  width: 100%;
  background: var(--paper-bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

svg.cx-svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 840 / 460;
}

/* SVG Elements */
.cx-label {
  font-family: var(--font-math);
  font-style: italic;
  font-weight: 700;
  font-size: 21px;
  fill: var(--ink);
}

.cx-math-text {
  font-family: var(--font-km);
  font-size: 15px;
  font-weight: 600;
}

.line-xy {
  stroke: var(--ink);
  stroke-width: 3.2;
  stroke-linecap: round;
}

.line-perp-active {
  stroke: var(--orange);
  stroke-width: 3.8;
  stroke-linecap: round;
}

.line-perp-final {
  stroke: var(--green);
  stroke-width: 4;
  stroke-linecap: round;
}

.line-extended {
  stroke: var(--green);
  stroke-width: 3;
  stroke-dasharray: 6 5;
  stroke-linecap: round;
}

.right-angle-mark {
  fill: none;
  stroke: var(--teal);
  stroke-width: 2.2;
}

/* Set Square Tool SVG */
.setsquare-group {
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.22));
  transition: opacity 0.25s ease;
}

.sq-body {
  fill: rgba(254, 243, 199, 0.72);
  stroke: #d97706;
  stroke-width: 1.8;
}

[data-theme="dark"] .sq-body {
  fill: rgba(245, 158, 11, 0.35);
  stroke: #fbbf24;
}

.sq-inner-hole {
  fill: var(--paper-bg);
  stroke: #d97706;
  stroke-width: 1.4;
}

[data-theme="dark"] .sq-inner-hole {
  fill: #0d1524;
  stroke: #fbbf24;
}

.sq-tick {
  stroke: #b45309;
  stroke-width: 1;
}

[data-theme="dark"] .sq-tick {
  stroke: #fcd34d;
}

/* Controls */
.controls-area {
  padding: 6px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.buttons-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-family: var(--font-km);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  min-height: 42px;
  user-select: none;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
}

.btn-primary {
  background: var(--teal);
  color: #ffffff;
  border-color: var(--teal);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--ink);
  border-color: var(--surface-border);
}

.btn-autoplay.active {
  background: var(--orange);
  color: #ffffff;
  border-color: var(--orange);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}

.steps-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.step-chip {
  flex: 1 1 0;
  min-width: 120px;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  color: var(--ink-muted);
  font-family: var(--font-km);
  font-size: 13.5px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.step-chip:hover {
  background: var(--surface-border);
  color: var(--ink);
}

.step-chip.active {
  background: var(--teal);
  color: #ffffff;
  border-color: var(--teal);
  box-shadow: var(--shadow-sm);
}

.step-chip.completed {
  color: var(--teal);
  border-color: var(--teal);
  background: var(--teal-soft);
}

/* Result banner */
.result-banner {
  margin: 0 20px 14px;
  padding: 12px 18px;
  background: var(--green-soft);
  border: 1px solid var(--green);
  border-radius: var(--radius);
  color: var(--green);
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

.result-badge {
  background: var(--green);
  color: #ffffff;
  font-size: 13px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

/* Footer */
.app-footer {
  padding: 12px 24px;
  background: var(--surface-2);
  border-top: 1px solid var(--surface-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--ink-muted);
}

@media (max-width: 600px) {
  body { padding: 8px; }
  .app-header { padding: 12px 16px; }
  h1 { font-size: 18px; }
  .instruction-box { margin: 12px 12px 0; padding: 10px 14px; }
  .canvas-wrap { padding: 12px 12px; }
  .controls-area { padding: 4px 12px 14px; }
  .buttons-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn-autoplay { grid-column: span 2; }
  .result-banner { margin: 0 12px 12px; }
}
</style>

<div class="app-container">

<script>
/**
 * Grade 7 · Lesson 14 · 14-A: Perpendicular with a set square
 */

const PT_A = { x: 380, y: 280 };
const PT_B = { x: 380, y: 90 };
const PT_EXT = { x: 380, y: 390 };

// Dimensions of 45-45-90 Set Square:
// Right angle at (0, 0), leg 1 along +x (length 200), leg 2 along -y (length 200)
const SQ_LEG = 200;

const STEPS = [
  {
    num: 1,
    title: 'ជំហានទី ១',
    text: 'ដាក់កែង (កែង ៤៥° ឬ ៦០°) ឱ្យជ្រុងមុំកែងម្ខាងនៅតាមបណ្ដោយបន្ទាត់ xy ហើយកំពូលមុំកែងចំចំណុច A។'
  },
  {
    num: 2,
    title: 'ជំហានទី ២',
    text: 'សង្កត់កែងឱ្យនឹងល្អ មិនឱ្យរអិល ឬឃ្លាតពីបន្ទាត់ xy។'
  },
  {
    num: 3,
    title: 'ជំហានទី ៣',
    text: 'យកខ្មៅដៃគូសបន្ទាត់តាមបណ្ដោយជ្រុងមុំកែងម្ខាងទៀត ចេញពីចំណុច A ទៅលើ ដល់ចំណុច B។'
  },
  {
    num: 4,
    title: 'ជំហានទី ៤',
    text: 'ដៅសញ្ញាមុំកែង ត្រង់ចំណុច A រួចសរសេរ AB ⊥ xy។ បន្ទាប់មក អាចបន្តពន្លូតបន្ទាត់នេះចុះក្រោមបន្ថែមទៀត (បន្ទាត់កាត់)។'
  }
];

let currentStep = 0;
let isAutoplaying = false;
let autoplayTimer = null;
let animFrameId = null;

// DOM
const layerDrawing = document.getElementById('layer-drawing');
const layerSetSquare = document.getElementById('layer-setsquare');
const stepBadge = document.getElementById('step-badge');
const stepText = document.getElementById('step-text');
const resultBanner = document.getElementById('result-banner');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnAutoplay = document.getElementById('btn-autoplay');
const stepsNav = document.getElementById('steps-nav');

function createSvgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/**
 * Build 45-45-90 Set Square with Triangular Cutout and millimeter ticks
 */
function buildSetSquareSVG() {
  const g = createSvgEl('g');
  
  // Right angle vertex is at (0, 0).
  // Leg 1 goes along +X from (0,0) to (SQ_LEG, 0)
  // Leg 2 goes along -Y from (0,0) to (0, -SQ_LEG)
  // Hypotenuse from (0, -SQ_LEG) to (SQ_LEG, 0)
  
  // Outer body
  const outerPath = `M 0 0 L ${SQ_LEG} 0 L 0 ${-SQ_LEG} Z`;
  
  // Inner cutout triangular hole
  const mX = SQ_LEG * 0.28, mY = -SQ_LEG * 0.28;
  const innerPath = `M ${mX} ${mY} L ${SQ_LEG * 0.72} ${mY} L ${mX} ${-SQ_LEG * 0.72} Z`;
  
  const body = createSvgEl('path', {
    d: `${outerPath} ${innerPath}`,
    'fill-rule': 'evenodd',
    class: 'sq-body'
  });
  g.appendChild(body);
  
  // Millimeter ticks along bottom edge (0 to SQ_LEG)
  for (let x = 15; x < SQ_LEG; x += 12) {
    const tickLen = (x % 36 === 0) ? 9 : 5;
    g.appendChild(createSvgEl('line', {
      x1: x, y1: 0, x2: x, y2: tickLen, class: 'sq-tick'
    }));
  }
  // Millimeter ticks along vertical edge (0 to -SQ_LEG)
  for (let y = 15; y < SQ_LEG; y += 12) {
    const tickLen = (y % 36 === 0) ? 9 : 5;
    g.appendChild(createSvgEl('line', {
      x1: 0, y1: -y, x2: tickLen, y2: -y, class: 'sq-tick'
    }));
  }
  
  // Right angle mini symbol inside ruler
  g.appendChild(createSvgEl('polyline', {
    points: `14,0 14,-14 0,-14`,
    fill: 'none', stroke: '#d97706', 'stroke-width': 1.2
  }));
  
  return g;
}

layerSetSquare.appendChild(buildSetSquareSVG());

function setSquarePos(x, y, opacity = 1) {
  layerSetSquare.setAttribute('transform', `translate(${x}, ${y})`);
  layerSetSquare.style.opacity = opacity;
}

function animateProgressive(duration, onUpdate, onComplete) {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  const startTime = performance.now();
  function loop(now) {
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / duration);
    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    onUpdate(ease, t);
    if (t < 1) animFrameId = requestAnimationFrame(loop);
    else { animFrameId = null; if (onComplete) onComplete(); }
  }
  animFrameId = requestAnimationFrame(loop);
}

function renderNavChips() {
  stepsNav.innerHTML = '';
  STEPS.forEach((step, idx) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = `step-chip ${idx === currentStep ? 'active' : ''} ${idx < currentStep ? 'completed' : ''}`;
    chip.textContent = step.title;
    chip.onclick = () => goToStep(idx);
    stepsNav.appendChild(chip);
  });
}

function updateUI() {
  const stepData = STEPS[currentStep];
  stepBadge.textContent = stepData.title;
  stepText.textContent = stepData.text;
  btnPrev.disabled = currentStep === 0;
  btnNext.disabled = currentStep === STEPS.length - 1;
  resultBanner.style.display = (currentStep === STEPS.length - 1) ? 'flex' : 'none';
  renderNavChips();
}

/**
 * Render Step
 */
function renderScene(isAnimated = false) {
  layerDrawing.innerHTML = '';
  updateUI();
  
  if (currentStep === 0) {
    // STEP 1: Set square slides into position at A
    if (isAnimated) {
      animateProgressive(1200, (ease) => {
        const curX = 180 + (PT_A.x - 180) * ease;
        const curY = 360 + (PT_A.y - 360) * ease;
        setSquarePos(curX, curY, ease);
      }, () => {
        setSquarePos(PT_A.x, PT_A.y, 1);
        handleAutoplayNext();
      });
    } else {
      setSquarePos(PT_A.x, PT_A.y, 1);
    }
  }
  
  else if (currentStep === 1) {
    // STEP 2: Hold set square in place
    setSquarePos(PT_A.x, PT_A.y, 1);
    // Subtle glow / outline pulse indicating holding firm
    const glow = createSvgEl('rect', {
      x: PT_A.x - 4, y: PT_A.y - SQ_LEG - 4, width: SQ_LEG + 8, height: SQ_LEG + 8,
      fill: 'none', stroke: 'var(--teal)', 'stroke-width': 2, 'stroke-dasharray': '5 3', rx: 6
    });
    layerDrawing.appendChild(glow);
    if (isAnimated) setTimeout(handleAutoplayNext, 1800);
  }
  
  else if (currentStep === 2) {
    // STEP 3: Draw pencil line from A to B
    setSquarePos(PT_A.x, PT_A.y, 1);
    
    if (isAnimated) {
      animateProgressive(1100, (ease) => {
        const curY = PT_A.y + (PT_B.y - PT_A.y) * ease;
        layerDrawing.innerHTML = '';
        layerDrawing.appendChild(createSvgEl('line', {
          x1: PT_A.x, y1: PT_A.y, x2: PT_A.x, y2: curY, class: 'line-perp-active'
        }));
      }, () => {
        // Point B
        layerDrawing.appendChild(createSvgEl('circle', { cx: PT_B.x, cy: PT_B.y, r: 4.5, fill: 'var(--orange)' }));
        const lB = createSvgEl('text', { x: PT_B.x - 18, y: PT_B.y + 4, class: 'cx-label' });
        lB.textContent = 'B';
        layerDrawing.appendChild(lB);
        handleAutoplayNext();
      });
    } else {
      layerDrawing.appendChild(createSvgEl('line', {
        x1: PT_A.x, y1: PT_A.y, x2: PT_B.x, y2: PT_B.y, class: 'line-perp-active'
      }));
      layerDrawing.appendChild(createSvgEl('circle', { cx: PT_B.x, cy: PT_B.y, r: 4.5, fill: 'var(--orange)' }));
      const lB = createSvgEl('text', { x: PT_B.x - 18, y: PT_B.y + 4, class: 'cx-label' });
      lB.textContent = 'B';
      layerDrawing.appendChild(lB);
    }
  }
  
  else if (currentStep === 3) {
    // STEP 4: Remove/fade set square, mark right angle, extend line downwards
    setSquarePos(PT_A.x, PT_A.y, 0.2); // semi-transparent or retreated
    
    // Solid line AB
    layerDrawing.appendChild(createSvgEl('line', {
      x1: PT_A.x, y1: PT_A.y, x2: PT_B.x, y2: PT_B.y, class: 'line-perp-final'
    }));
    // Extended dashed line through A downwards
    layerDrawing.appendChild(createSvgEl('line', {
      x1: PT_A.x, y1: PT_A.y, x2: PT_EXT.x, y2: PT_EXT.y, class: 'line-extended'
    }));
    
    // Right angle square mark at A (top right)
    const sq = 22;
    layerDrawing.appendChild(createSvgEl('polyline', {
      points: `${PT_A.x + sq},${PT_A.y} ${PT_A.x + sq},${PT_A.y - sq} ${PT_A.x},${PT_A.y - sq}`,
      class: 'right-angle-mark'
    }));
    layerDrawing.appendChild(createSvgEl('circle', {
      cx: PT_A.x + sq/2, cy: PT_A.y - sq/2, r: 2.2, fill: 'var(--teal)'
    }));
    
    // Label B
    layerDrawing.appendChild(createSvgEl('circle', { cx: PT_B.x, cy: PT_B.y, r: 4.5, fill: 'var(--green)' }));
    const lB = createSvgEl('text', { x: PT_B.x - 18, y: PT_B.y + 4, class: 'cx-label' });
    lB.textContent = 'B';
    layerDrawing.appendChild(lB);
    
    // Text AB perpendicular to xy
    const tPerp = createSvgEl('text', {
      x: PT_A.x + 36, y: PT_A.y - 45, class: 'cx-math-text', fill: 'var(--green)', 'font-size': '16px', 'font-weight': '700'
    });
    tPerp.textContent = 'AB ⊥ xy';
    layerDrawing.appendChild(tPerp);
  }
}

function nextStep() {
  if (currentStep < STEPS.length - 1) {
    currentStep++;
    renderScene(true);
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderScene(false);
  }
}

function replayStep() {
  renderScene(true);
}

function resetConstruction() {
  currentStep = 0;
  if (isAutoplaying) toggleAutoplay(false);
  renderScene(true);
}

function goToStep(idx) {
  currentStep = idx;
  renderScene(true);
}

function handleAutoplayNext() {
  if (!isAutoplaying) return;
  if (autoplayTimer) clearTimeout(autoplayTimer);
  autoplayTimer = setTimeout(() => {
    if (!isAutoplaying) return;
    if (currentStep < STEPS.length - 1) nextStep();
    else toggleAutoplay(false);
  }, 2400);
}

function toggleAutoplay(forceState) {
  isAutoplaying = forceState !== undefined ? forceState : !isAutoplaying;
  if (isAutoplaying) {
    btnAutoplay.classList.add('active');
    btnAutoplay.innerHTML = '⏸ ផ្អាក';
    if (currentStep >= STEPS.length - 1) currentStep = 0;
    renderScene(true);
  } else {
    btnAutoplay.classList.remove('active');
    btnAutoplay.innerHTML = '▶ ស្វ័យប្រវត្តិ';
    if (autoplayTimer) clearTimeout(autoplayTimer);
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let target = current === 'light' ? 'dark' : (current === 'dark' ? 'light' : (prefersDark ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', target);
}

document.addEventListener('DOMContentLoaded', () => {
  renderScene(true);
});
</script>

<script>
/* in the khmermath.org page: the site's theme, no theme button, the page told the height */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add('embed');
  var st = document.createElement('style');
  st.textContent = '.embed body{min-height:0!important;padding:0!important;background:transparent!important}' +
    '.embed .theme-btn{display:none!important}.embed .lesson-badge{display:none!important}' +
    '.embed .app-container{box-shadow:none!important}.embed .title-area{display:none!important}';
  document.head.appendChild(st);
  addEventListener('DOMContentLoaded', function(){        // a header with nothing left in it goes too
    var h = document.querySelector('.app-header'); if (!h) return;
    var keep = h.querySelectorAll('button:not(.theme-btn), input, select, label');
    if (!keep.length) h.style.display = 'none';
    else h.querySelector('.header-actions') && (h.style.justifyContent = 'flex-start');
  });
  function theme(){ try { var t = localStorage.getItem('km-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
  theme(); addEventListener('storage', theme);
  function post(){ var h = Math.ceil(document.querySelector('.app-container').getBoundingClientRect().height) + 2;
    parent.postMessage({kmFrameH: h}, '*'); }
  addEventListener('load', post); addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.querySelector('.app-container'));
  setInterval(post, 700);
})();
</script>
