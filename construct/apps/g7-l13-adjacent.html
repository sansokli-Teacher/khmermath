<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>មុំជាប់គ្នា និងមុំនៅលើបន្ទាត់ត្រង់ — ថ្នាក់ទី ៧ · មេរៀនទី ១៣</title>
<style>
/* Reset & Theme */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --orange: #ea580c;
  --orange-soft: #ffedd5;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
  
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-full: 9999px;
  
  --font-km: system-ui, "Kantumruy Pro", "Noto Sans Khmer", -apple-system, sans-serif;
  --font-math: "Times New Roman", "STIX Two Text", Georgia, serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17;
    --surface: #131c2e;
    --surface-2: #1e293b;
    --surface-border: #334155;
    --paper-bg: #0d1524;
    --grid-line: #172338;
    --grid-line-major: #22324d;
    
    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --ink-muted: #94a3b8;
    
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, 0.15);
    --orange: #f97316;
    --orange-soft: rgba(249, 115, 22, 0.15);
    --teal: #14b8a6;
    --teal-soft: rgba(20, 184, 166, 0.15);
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.15);
  }
}

[data-theme="dark"] {
  --bg: #090e17;
  --surface: #131c2e;
  --surface-2: #1e293b;
  --surface-border: #334155;
  --paper-bg: #0d1524;
  --grid-line: #172338;
  --grid-line-major: #22324d;
  
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --ink-muted: #94a3b8;
  
  --blue: #3b82f6;
  --blue-soft: rgba(59, 130, 246, 0.15);
  --orange: #f97316;
  --orange-soft: rgba(249, 115, 22, 0.15);
  --teal: #14b8a6;
  --teal-soft: rgba(20, 184, 166, 0.15);
  --green: #22c55e;
  --green-soft: rgba(34, 197, 94, 0.15);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-border: #cbd5e1;
  --paper-bg: #fffefa;
  --grid-line: #e2e8f0;
  --grid-line-major: #cbd5e1;
  
  --ink: #0f172a;
  --ink-secondary: #334155;
  --ink-muted: #64748b;
  
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --orange: #ea580c;
  --orange-soft: #ffedd5;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --green: #1b8a5a;
  --green-soft: #d1fae5;
}

body {
  font-family: var(--font-km);
  background-color: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  line-height: 1.6;
}

.app-container {
  width: 100%;
  max-width: 920px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Header */
.app-header {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title-area {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lesson-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 10px;
  border-radius: var(--radius-full);
  width: fit-content;
}

h1 {
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Tab Switcher */
.mode-tabs {
  display: flex;
  background: var(--surface-2);
  padding: 3px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
}

.mode-tab-btn {
  border: none;
  background: transparent;
  color: var(--ink-secondary);
  font-family: var(--font-km);
  font-size: 14.5px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.mode-tab-btn.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

.theme-btn {
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  color: var(--ink);
  font-size: 16px;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  cursor: pointer;
}

/* Live Equation Banner */
.equation-banner {
  margin: 16px 20px 0;
  padding: 14px 20px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.equation-main {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 700;
  font-family: var(--font-math);
}

.color-tag-blue {
  color: var(--blue);
}

.color-tag-orange {
  color: var(--orange);
}

.color-tag-green {
  color: var(--green);
}

.options-check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}

.options-check input {
  accent-color: var(--teal);
  width: 17px;
  height: 17px;
}

/* Canvas Board */
.canvas-wrap {
  padding: 16px 20px;
}

.canvas-board {
  position: relative;
  width: 100%;
  background: var(--paper-bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

svg.cx-svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 840 / 440;
  touch-action: none;
}

/* SVG typography & classes */
.cx-label {
  font-family: var(--font-math);
  font-style: italic;
  font-weight: 700;
  font-size: 21px;
  fill: var(--ink);
}

.cx-math-text {
  font-family: var(--font-km);
  font-size: 14.5px;
  font-weight: 600;
}

.ray-base {
  stroke: var(--ink);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.ray-y {
  stroke: var(--ink-secondary);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.ray-z {
  stroke: var(--ink-secondary);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.handle-point {
  stroke: #ffffff;
  stroke-width: 2.5;
  cursor: grab;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}

.handle-point:active {
  cursor: grabbing;
}

.arc-blue {
  fill: rgba(37, 99, 235, 0.15);
  stroke: var(--blue);
  stroke-width: 2.8;
  stroke-linecap: round;
}

.arc-orange {
  fill: rgba(234, 88, 12, 0.15);
  stroke: var(--orange);
  stroke-width: 2.8;
  stroke-linecap: round;
}

.arc-green-sum {
  fill: none;
  stroke: var(--green);
  stroke-width: 2;
  stroke-dasharray: 4 3;
}

/* Slider Controls */
.controls-area {
  padding: 6px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface-2);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
}

.slider-row label {
  font-weight: 700;
  font-size: 14.5px;
  min-width: 140px;
}

.slider-row input[type="range"] {
  flex-grow: 1;
  accent-color: var(--teal);
  cursor: pointer;
}

.slider-val {
  min-width: 50px;
  font-family: var(--font-math);
  font-weight: 700;
  font-size: 16px;
  text-align: right;
}

/* Quick Jump buttons */
.quick-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn-pill {
  padding: 6px 14px;
  background: var(--surface-2);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-full);
  font-family: var(--font-km);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-pill:hover {
  background: var(--surface-border);
}

/* Footer */
.app-footer {
  padding: 12px 24px;
  background: var(--surface-2);
  border-top: 1px solid var(--surface-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--ink-muted);
}

@media (max-width: 600px) {
  body { padding: 8px; }
  .app-header { padding: 12px 16px; }
  h1 { font-size: 18px; }
  .equation-banner { margin: 12px 12px 0; padding: 10px 14px; }
  .equation-main { font-size: 16px; }
  .canvas-wrap { padding: 12px 12px; }
  .controls-area { padding: 4px 12px 14px; }
}
</style>

<body>

<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="title-area">
      <div class="lesson-badge">ថ្នាក់ទី ៧ · មេរៀនទី ១៣ · មុំ</div>
      <h1 id="page-title">មុំនៅលើបន្ទាត់ត្រង់ (ផលបូក ១៨០°)</h1>
    </div>

    <div class="header-actions">
      <!-- Tabs -->
      <div class="mode-tabs" role="tablist">
        <button class="mode-tab-btn active" id="tab-straight" role="tab" onclick="switchTab('straight')">
          📏 មុំលើបន្ទាត់ត្រង់
        </button>
        <button class="mode-tab-btn" id="tab-adjacent" role="tab" onclick="switchTab('adjacent')">
          📐 មុំជាប់គ្នាទូទៅ
        </button>
      </div>

      <button class="theme-btn" id="theme-toggle" title="ប្ដូរផ្ទៃភ្លឺ/ងងឹត" aria-label="ប្ដូរផ្ទៃភ្លឺ ឬងងឹត" onclick="toggleTheme()">
        🌓
      </button>
    </div>
  </header>

  <!-- Live Equation Banner -->
  <div class="equation-banner">
    <div class="equation-main" id="equation-display">
      <span class="color-tag-blue">xOy = ៦០°</span>
      <span>+</span>
      <span class="color-tag-orange">yOx′ = ១២០°</span>
      <span>=</span>
      <span class="color-tag-green">១៨០°</span>
    </div>

    <!-- Toggle for 90-degree snap (Tab 1) -->
    <label class="options-check" id="box-perp-wrap">
      <input type="checkbox" id="check-perp" onchange="togglePerpendicular(this.checked)">
      <span>មុំបំពេញ (កែងគ្នា ៩០°/៩០°)</span>
    </label>
  </div>

  <!-- SVG Canvas -->
  <main class="canvas-wrap">
    <div class="canvas-board">
      <svg class="cx-svg" id="geometry-svg" viewBox="0 0 840 440" role="img" aria-label="គំនូរបង្ហាញមុំជាប់គ្នានិងមុំនៅលើបន្ទាត់ត្រង់">
        <defs>
          <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-line)" stroke-width="1" />
          </pattern>
          <pattern id="grid-pattern-major" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#grid-pattern)" />
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--grid-line-major)" stroke-width="1.2" />
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid-pattern-major)" />

        <!-- Static Axes & Elements -->
        <g id="layer-static-axes"></g>

        <!-- Arcs Layer -->
        <g id="layer-arcs"></g>

        <!-- Dynamic Rays Layer -->
        <g id="layer-rays"></g>
      </svg>
    </div>
  </main>

  <!-- Controls Area -->
  <div class="controls-area">
    <!-- Slider for Ray Oy -->
    <div class="slider-row">
      <label id="slider-label-y" for="slider-y">រង្វាស់មុំ xOy ៖</label>
      <input type="range" id="slider-y" min="5" max="175" step="1" value="60" oninput="setAngleY(parseInt(this.value))">
      <span class="slider-val" id="val-slider-y" style="color: var(--blue);">៦០°</span>
    </div>

    <!-- Slider for Ray Oz (Only in Adjacent mode) -->
    <div class="slider-row" id="row-slider-z" style="display: none;">
      <label for="slider-z">រង្វាស់មុំ yOz ៖</label>
      <input type="range" id="slider-z" min="10" max="90" step="1" value="45" oninput="setAngleZ(parseInt(this.value))">
      <span class="slider-val" id="val-slider-z" style="color: var(--orange);">៤៥°</span>
    </div>

    <!-- Preset Angles -->
    <div class="quick-buttons" id="quick-buttons">
      <button type="button" class="btn-pill" onclick="setAngleY(30)">៣០° + ១៥០°</button>
      <button type="button" class="btn-pill" onclick="setAngleY(45)">៤៥° + ១៣៥°</button>
      <button type="button" class="btn-pill" onclick="setAngleY(60)">៦០° + ១២០°</button>
      <button type="button" class="btn-pill" onclick="setAngleY(90)">៩០° + ៩០° (កែងគ្នា)</button>
      <button type="button" class="btn-pill" onclick="setAngleY(120)">១២០° + ៦០°</button>
      <button type="button" class="btn-pill" onclick="setAngleY(145)">១៤៥° + ៣៥°</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <span>ប្រភព៖ សៀវភៅគណិតវិទ្យា ថ្នាក់ទី ៧ · មេរៀនទី ១៣</span>
    <span>KhmerMath · មុំជាប់គ្នា</span>
  </footer>
</div>

<script>
/**
 * Grade 7 · Lesson 13 · 13-B: Adjacent angles and angles on a straight line
 */

const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
function toKhmer(num) {
  return String(num).replace(/[0-9]/g, d => khmerDigits[d]);
}

const O = { x: 420, y: 270 };
const RAY_LEN = 240;

let currentTab = 'straight'; // 'straight' or 'adjacent'
let angleY = 60; // deg
let angleZ_offset = 45; // deg relative to Oy for tab 2

// DOM
const layerStatic = document.getElementById('layer-static-axes');
const layerArcs = document.getElementById('layer-arcs');
const layerRays = document.getElementById('layer-rays');
const equationDisplay = document.getElementById('equation-display');
const sliderY = document.getElementById('slider-y');
const valSliderY = document.getElementById('val-slider-y');
const sliderZ = document.getElementById('slider-z');
const valSliderZ = document.getElementById('val-slider-z');
const rowSliderZ = document.getElementById('row-slider-z');
const sliderLabelY = document.getElementById('slider-label-y');
const boxPerpWrap = document.getElementById('box-perp-wrap');
const checkPerp = document.getElementById('check-perp');
const quickButtons = document.getElementById('quick-buttons');
const pageTitle = document.getElementById('page-title');

function createSvgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/**
 * Draw sector wedge
 */
function createWedge(center, r, degStart, degEnd, className) {
  const rad1 = degStart * Math.PI / 180;
  const rad2 = degEnd * Math.PI / 180;
  const x1 = center.x + r * Math.cos(rad1);
  const y1 = center.y - r * Math.sin(rad1);
  const x2 = center.x + r * Math.cos(rad2);
  const y2 = center.y - r * Math.sin(rad2);
  const largeArc = Math.abs(degEnd - degStart) > 180 ? 1 : 0;
  
  return createSvgEl('path', {
    d: `M ${center.x} ${center.y} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 0 ${x2} ${y2} Z`,
    class: className
  });
}

function updateScene() {
  layerStatic.innerHTML = '';
  layerArcs.innerHTML = '';
  layerRays.innerHTML = '';
  
  if (currentTab === 'straight') {
    // TAB 1: Straight line xx'
    // Horizontal line
    layerStatic.appendChild(createSvgEl('line', {
      x1: 100, y1: O.y, x2: 740, y2: O.y, class: 'ray-base'
    }));
    // Arrows
    layerStatic.appendChild(createSvgEl('polygon', { points: `90,${O.y} 104,${O.y-5} 104,${O.y+5}`, fill: 'var(--ink)' }));
    layerStatic.appendChild(createSvgEl('polygon', { points: `750,${O.y} 736,${O.y-5} 736,${O.y+5}`, fill: 'var(--ink)' }));
    
    // Origin O
    layerStatic.appendChild(createSvgEl('circle', { cx: O.x, cy: O.y, r: 5, fill: 'var(--ink)' }));
    
    // Labels
    const lO = createSvgEl('text', { x: O.x, y: O.y + 24, 'text-anchor': 'middle', class: 'cx-label' });
    lO.textContent = 'O';
    const lx = createSvgEl('text', { x: 745, y: O.y + 24, class: 'cx-label' });
    lx.textContent = 'x';
    const lxPrime = createSvgEl('text', { x: 80, y: O.y + 24, class: 'cx-label' });
    lxPrime.textContent = 'x′';
    layerStatic.append(lO, lx, lxPrime);
    
    const deg1 = angleY;
    const deg2 = 180 - angleY;
    
    // Arc 1 (xOy): blue
    layerArcs.appendChild(createWedge(O, 80, 0, deg1, 'arc-blue'));
    // Arc 2 (yOx'): orange
    layerArcs.appendChild(createWedge(O, 95, deg1, 180, 'arc-orange'));
    
    // Text labels inside arcs
    const mid1Rad = (deg1 / 2) * Math.PI / 180;
    const mid2Rad = ((deg1 + 180) / 2) * Math.PI / 180;
    
    const t1 = createSvgEl('text', {
      x: O.x + 115 * Math.cos(mid1Rad), y: O.y - 115 * Math.sin(mid1Rad) + 5,
      'text-anchor': 'middle', fill: 'var(--blue)', 'font-weight': '700', 'font-size': '16px', 'font-family': 'var(--font-km)'
    });
    t1.textContent = `${toKhmer(deg1)}°`;
    
    const t2 = createSvgEl('text', {
      x: O.x + 125 * Math.cos(mid2Rad), y: O.y - 125 * Math.sin(mid2Rad) + 5,
      'text-anchor': 'middle', fill: 'var(--orange)', 'font-weight': '700', 'font-size': '16px', 'font-family': 'var(--font-km)'
    });
    t2.textContent = `${toKhmer(deg2)}°`;
    layerArcs.append(t1, t2);
    
    // Ray Oy
    const radY = deg1 * Math.PI / 180;
    const yX = O.x + RAY_LEN * Math.cos(radY);
    const yY = O.y - RAY_LEN * Math.sin(radY);
    
    layerRays.appendChild(createSvgEl('line', {
      x1: O.x, y1: O.y, x2: yX, y2: yY, class: 'ray-y'
    }));
    // Arrow
    const uX = Math.cos(radY), uY = -Math.sin(radY);
    layerRays.appendChild(createSvgEl('polygon', {
      points: `${yX+8*uX},${yY+8*uY} ${yX-12*uX-7*uY},${yY-12*uY+7*uX} ${yX-12*uX+7*uY},${yY-12*uY-7*uX}`,
      fill: 'var(--ink-secondary)'
    }));
    // Drag handle
    layerRays.appendChild(createSvgEl('circle', {
      id: 'handle-y', cx: yX - 25 * uX, cy: yY - 25 * uY, r: 8, class: 'handle-point', fill: 'var(--teal)'
    }));
    // Label y
    const ly = createSvgEl('text', {
      x: yX + 16 * uX, y: yY + 16 * uY + 6, class: 'cx-label', 'text-anchor': 'middle'
    });
    ly.textContent = 'y';
    layerRays.appendChild(ly);
    
    // Right angle square if 90
    if (deg1 === 90) {
      const sq = 24;
      layerArcs.appendChild(createSvgEl('polyline', {
        points: `${O.x+sq},${O.y} ${O.x+sq},${O.y-sq} ${O.x},${O.y-sq}`,
        fill: 'none', stroke: 'var(--blue)', 'stroke-width': 2
      }));
      layerArcs.appendChild(createSvgEl('polyline', {
        points: `${O.x-sq},${O.y} ${O.x-sq},${O.y-sq} ${O.x},${O.y-sq}`,
        fill: 'none', stroke: 'var(--orange)', 'stroke-width': 2
      }));
    }
    
    // Equation display
    equationDisplay.innerHTML = `
      <span class="color-tag-blue">xOy = ${toKhmer(deg1)}°</span>
      <span>+</span>
      <span class="color-tag-orange">yOx′ = ${toKhmer(deg2)}°</span>
      <span>=</span>
      <span class="color-tag-green">១៨០°</span>
    `;
    
    valSliderY.textContent = `${toKhmer(deg1)}°`;
    checkPerp.checked = (deg1 === 90);
  }
  
  else {
    // TAB 2: General adjacent angles xOy and yOz
    // Ray Ox horizontal right
    layerStatic.appendChild(createSvgEl('line', {
      x1: O.x, y1: O.y, x2: O.x + RAY_LEN, y2: O.y, class: 'ray-base'
    }));
    layerStatic.appendChild(createSvgEl('polygon', {
      points: `${O.x+RAY_LEN+8},${O.y} ${O.x+RAY_LEN-12},${O.y-6} ${O.x+RAY_LEN-12},${O.y+6}`, fill: 'var(--ink)'
    }));
    layerStatic.appendChild(createSvgEl('circle', { cx: O.x, cy: O.y, r: 5, fill: 'var(--ink)' }));
    
    const lO = createSvgEl('text', { x: O.x - 16, y: O.y + 18, class: 'cx-label' });
    lO.textContent = 'O';
    const lx = createSvgEl('text', { x: O.x + RAY_LEN + 18, y: O.y + 6, class: 'cx-label' });
    lx.textContent = 'x';
    layerStatic.append(lO, lx);
    
    const deg1 = angleY;
    const deg2 = angleZ_offset;
    const degTotal = deg1 + deg2;
    
    // Wedge 1 (xOy): blue
    layerArcs.appendChild(createWedge(O, 85, 0, deg1, 'arc-blue'));
    // Wedge 2 (yOz): orange
    layerArcs.appendChild(createWedge(O, 105, deg1, degTotal, 'arc-orange'));
    
    // Total sum outer curve (xOz): green dashed
    const rTot = 130;
    const startX = O.x + rTot;
    const startY = O.y;
    const radTot = degTotal * Math.PI / 180;
    const endX = O.x + rTot * Math.cos(radTot);
    const endY = O.y - rTot * Math.sin(radTot);
    layerArcs.appendChild(createSvgEl('path', {
      d: `M ${startX} ${startY} A ${rTot} ${rTot} 0 0 0 ${endX} ${endY}`,
      class: 'arc-green-sum'
    }));
    
    // Text labels inside arcs
    const mid1Rad = (deg1 / 2) * Math.PI / 180;
    const mid2Rad = (deg1 + deg2 / 2) * Math.PI / 180;
    
    const t1 = createSvgEl('text', {
      x: O.x + 115 * Math.cos(mid1Rad), y: O.y - 115 * Math.sin(mid1Rad) + 5,
      'text-anchor': 'middle', fill: 'var(--blue)', 'font-weight': '700', 'font-size': '15px', 'font-family': 'var(--font-km)'
    });
    t1.textContent = `${toKhmer(deg1)}°`;
    
    const t2 = createSvgEl('text', {
      x: O.x + 135 * Math.cos(mid2Rad), y: O.y - 135 * Math.sin(mid2Rad) + 5,
      'text-anchor': 'middle', fill: 'var(--orange)', 'font-weight': '700', 'font-size': '15px', 'font-family': 'var(--font-km)'
    });
    t2.textContent = `${toKhmer(deg2)}°`;
    layerArcs.append(t1, t2);
    
    // Ray Oy
    const radY = deg1 * Math.PI / 180;
    const yX = O.x + RAY_LEN * Math.cos(radY);
    const yY = O.y - RAY_LEN * Math.sin(radY);
    layerRays.appendChild(createSvgEl('line', {
      x1: O.x, y1: O.y, x2: yX, y2: yY, class: 'ray-y'
    }));
    const uX = Math.cos(radY), uY = -Math.sin(radY);
    layerRays.appendChild(createSvgEl('polygon', {
      points: `${yX+8*uX},${yY+8*uY} ${yX-12*uX-7*uY},${yY-12*uY+7*uX} ${yX-12*uX+7*uY},${yY-12*uY-7*uX}`,
      fill: 'var(--ink-secondary)'
    }));
    layerRays.appendChild(createSvgEl('circle', {
      id: 'handle-y', cx: yX - 25 * uX, cy: yY - 25 * uY, r: 8, class: 'handle-point', fill: 'var(--teal)'
    }));
    const ly = createSvgEl('text', {
      x: yX + 16 * uX, y: yY + 16 * uY + 6, class: 'cx-label', 'text-anchor': 'middle'
    });
    ly.textContent = 'y';
    layerRays.appendChild(ly);
    
    // Ray Oz
    const radZ = degTotal * Math.PI / 180;
    const zX = O.x + RAY_LEN * Math.cos(radZ);
    const zY = O.y - RAY_LEN * Math.sin(radZ);
    layerRays.appendChild(createSvgEl('line', {
      x1: O.x, y1: O.y, x2: zX, y2: zY, class: 'ray-z'
    }));
    const zuX = Math.cos(radZ), zuY = -Math.sin(radZ);
    layerRays.appendChild(createSvgEl('polygon', {
      points: `${zX+8*zuX},${zY+8*zuY} ${zX-12*zuX-7*zuY},${zY-12*zuY+7*zuX} ${zX-12*zuX+7*zuY},${zY-12*zuY-7*zuX}`,
      fill: 'var(--ink-secondary)'
    }));
    layerRays.appendChild(createSvgEl('circle', {
      id: 'handle-z', cx: zX - 25 * zuX, cy: zY - 25 * zuY, r: 8, class: 'handle-point', fill: 'var(--orange)'
    }));
    const lz = createSvgEl('text', {
      x: zX + 16 * zuX, y: zY + 16 * zuY + 6, class: 'cx-label', 'text-anchor': 'middle'
    });
    lz.textContent = 'z';
    layerRays.appendChild(lz);
    
    // Equation display
    equationDisplay.innerHTML = `
      <span class="color-tag-blue">xOy = ${toKhmer(deg1)}°</span>
      <span>+</span>
      <span class="color-tag-orange">yOz = ${toKhmer(deg2)}°</span>
      <span>=</span>
      <span class="color-tag-green">xOz = ${toKhmer(degTotal)}°</span>
    `;
    
    valSliderY.textContent = `${toKhmer(deg1)}°`;
    valSliderZ.textContent = `${toKhmer(deg2)}°`;
  }
  
  initRayDrag();
}

function setAngleY(deg) {
  angleY = deg;
  sliderY.value = deg;
  updateScene();
}

function setAngleZ(deg) {
  angleZ_offset = deg;
  sliderZ.value = deg;
  updateScene();
}

function togglePerpendicular(checked) {
  setAngleY(checked ? 90 : 60);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-straight').classList.toggle('active', tab === 'straight');
  document.getElementById('tab-adjacent').classList.toggle('active', tab === 'adjacent');
  
  if (tab === 'straight') {
    pageTitle.textContent = 'មុំនៅលើបន្ទាត់ត្រង់ (ផលបូក ១៨០°)';
    sliderLabelY.textContent = 'រង្វាស់មុំ xOy ៖';
    sliderY.min = 5;
    sliderY.max = 175;
    rowSliderZ.style.display = 'none';
    boxPerpWrap.style.display = 'inline-flex';
    quickButtons.style.display = 'flex';
  } else {
    pageTitle.textContent = 'មុំជាប់គ្នាពីរ និងមុំផលបូក';
    sliderLabelY.textContent = 'រង្វាស់មុំ xOy ៖';
    sliderY.min = 10;
    sliderY.max = 100;
    if (angleY > 100) angleY = 45;
    rowSliderZ.style.display = 'flex';
    boxPerpWrap.style.display = 'none';
    quickButtons.style.display = 'none';
  }
  
  updateScene();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let target = current === 'light' ? 'dark' : (current === 'dark' ? 'light' : (prefersDark ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', target);
}

function initRayDrag() {
  const svg = document.getElementById('geometry-svg');
  const handleY = document.getElementById('handle-y');
  const handleZ = document.getElementById('handle-z');
  
  let activeHandle = null;
  
  function getAngleFromPointer(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX || (e.touches && e.touches[0].clientX);
    pt.y = e.clientY || (e.touches && e.touches[0].clientY);
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    const dx = svgP.x - O.x;
    const dy = O.y - svgP.y;
    let ang = Math.atan2(dy, dx) * 180 / Math.PI;
    if (ang < 0) ang += 360;
    return Math.round(ang);
  }
  
  if (handleY) {
    handleY.onpointerdown = (e) => {
      activeHandle = 'y';
      handleY.setPointerCapture(e.pointerId);
    };
  }
  
  if (handleZ) {
    handleZ.onpointerdown = (e) => {
      activeHandle = 'z';
      handleZ.setPointerCapture(e.pointerId);
    };
  }
  
  svg.onpointermove = (e) => {
    if (!activeHandle) return;
    const ang = getAngleFromPointer(e);
    
    if (activeHandle === 'y') {
      if (currentTab === 'straight') {
        const clamped = Math.max(5, Math.min(175, ang));
        setAngleY(clamped);
      } else {
        const clamped = Math.max(10, Math.min(100, ang));
        setAngleY(clamped);
      }
    } else if (activeHandle === 'z') {
      const offset = ang - angleY;
      const clampedOffset = Math.max(10, Math.min(90, offset));
      setAngleZ(clampedOffset);
    }
  };
  
  const endDrag = () => {
    activeHandle = null;
  };
  svg.onpointerup = endDrag;
  svg.onpointercancel = endDrag;
}

document.addEventListener('DOMContentLoaded', () => {
  updateScene();
});
</script>

<script>
/* in the khmermath.org page: the site's theme, no theme button, the page told the height */
(function(){
  if (window.parent === window) return;
  document.documentElement.classList.add('embed');
  var st = document.createElement('style');
  st.textContent = '.embed body{min-height:0!important;padding:0!important;background:transparent!important}' +
    '.embed .theme-btn{display:none!important}.embed .lesson-badge{display:none!important}' +
    '.embed .app-container{box-shadow:none!important}.embed .title-area{display:none!important}';
  document.head.appendChild(st);
  addEventListener('DOMContentLoaded', function(){        // a header with nothing left in it goes too
    var h = document.querySelector('.app-header'); if (!h) return;
    var keep = h.querySelectorAll('button:not(.theme-btn), input, select, label');
    if (!keep.length) h.style.display = 'none';
    else h.querySelector('.header-actions') && (h.style.justifyContent = 'flex-start');
  });
  function theme(){ try { var t = localStorage.getItem('km-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme'); } catch (e) {} }
  theme(); addEventListener('storage', theme);
  function post(){ var h = Math.ceil(document.querySelector('.app-container').getBoundingClientRect().height) + 2;
    parent.postMessage({kmFrameH: h}, '*'); }
  addEventListener('load', post); addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.querySelector('.app-container'));
  setInterval(post, 700);
})();
</script>
