<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>វិញ្ញាសាប្រឡង</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/paper.css">
<script src="katex/katex.min.js"></script>
</head>
<body class="paper-body">

<div class="paper-toolbar no-print" id="toolbar">
  <div class="paper-toolbar-in">
    <div class="row">
      <button id="print-btn">🖨 បោះពុម្ព / រក្សាទុកជា PDF</button>
      <label class="tb-check"><input type="checkbox" id="opt-key"> បង្ហាញចម្លើយ (សម្រាប់គ្រូ)</label>
      <label class="tb-check"><input type="checkbox" id="opt-space" checked> ទុកចន្លោះសរសេរចម្លើយ</label>
    </div>
    <div class="row">
      <span class="muted">រយៈពេល</span><input type="number" id="opt-min" value="70" style="width:80px;">
      <span class="muted">នាទី · កាលបរិច្ឆេទ</span><input type="text" id="opt-date" placeholder="ថ្ងៃទី ... ខែ ... ឆ្នាំ ..." style="width:200px;">
      <a href="teacher.html" class="btn secondary">← ត្រឡប់</a>
    </div>
    <div class="muted" style="font-size:13px;">ពេលចុចបោះពុម្ព សូមជ្រើស «Save as PDF / រក្សាទុកជា PDF» ជាគោលដៅ។ បើកជម្រើស «Background graphics» ហើយបិទ «Headers and footers» ដើម្បីឱ្យវិញ្ញាសាស្អាត។</div>
  </div>
</div>

<main class="sheet" id="sheet"></main>

<script src="js/common.js"></script>
<script src="js/mathtype.js"></script>
<script src="js/paper.js"></script>
</body>
</html>
