<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>វិញ្ញាសាប្រឡង</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2260d6">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/paper.css">
<script src="katex/katex.min.js"></script>
</head>
<body class="paper-body">

<div class="paper-app">
<aside class="paper-side no-print" id="toolbar">
  <div class="side-head">
    <a href="teacher.html" class="side-back">← ត្រឡប់</a>
    <div class="side-title" id="side-title">ចេញវិញ្ញាសា</div>
  </div>
  <div class="side-actions">
    <button id="pdf-btn" class="act-main">⬇ ទាញយក PDF</button>
    <button id="docx-btn" class="secondary act-alt">📝 Word</button>
    <button id="print-btn" class="secondary act-print" title="បោះពុម្ព">🖨</button>
  </div>
  <details class="side-opts" id="side-opts" open>
    <summary>⚙ ជម្រើសវិញ្ញាសា</summary>
    <section id="sec-format">
      <h3>ទម្រង់</h3>
      <select id="opt-tpl">
        <option value="exam">ទម្រង់ ១ — ប្រឡងសញ្ញាបត្រ (NGS)</option>
        <option value="pretest">ទម្រង់ ២ — បុរេតេស្ត (Pre-test)</option>
      </select>
      <input type="text" id="opt-sub" placeholder="ចំណងជើងរង (ទម្រង់ ២)">
    </section>
    <section id="sec-time">
      <h3>ពេលវេលា</h3>
      <div class="two-col">
        <label class="fld"><span>រយៈពេល (នាទី)</span><input type="number" id="opt-min" value="70"></label>
        <label class="fld"><span>កាលបរិច្ឆេទ</span><input type="text" id="opt-date" placeholder="ថ្ងៃទី … ខែ … ឆ្នាំ …"></label>
      </div>
    </section>
    <section>
      <h3>មាតិកា</h3>
      <label class="fld" id="lbl-ans"><span>ចម្លើយ (អត្រាកំណែ)</span>
        <select id="opt-ans">
          <option value="none">📄 សំណួរតែប៉ុណ្ណោះ — មិនដាក់ចម្លើយ</option>
          <option value="both">📘 សំណួរ + ចម្លើយ — ក្នុងឯកសារតែមួយ</option>
          <option value="key">✅ ចម្លើយតែប៉ុណ្ណោះ — សម្រាប់គ្រូ</option>
        </select>
      </label>
      <input type="checkbox" id="opt-key" hidden>
      <label class="sw"><input type="checkbox" id="opt-space" checked><span>ទុកចន្លោះសរសេរចម្លើយ</span></label>
      <label class="sw" id="lbl-newpage" hidden><input type="checkbox" id="opt-newpage"><span>ចាប់ផ្តើមមេរៀននីមួយៗលើទំព័រថ្មី</span></label>
      <label class="sw" id="lbl-omr"><input type="checkbox" id="opt-omr" checked><span>សន្លឹកចម្លើយ OMR + សន្លឹកសរសេរ</span></label>
      <label class="fld" id="lbl-iddigits"><span>ចំនួនខ្ទង់លេខសម្គាល់សិស្ស (សម្រាប់ស្កេន OMR)</span><input type="number" id="opt-iddigits" value="7" min="1" max="12"></label>
      <label class="sw" id="lbl-group"><input type="checkbox" id="opt-group"><span>ដាក់ជាក្រុមតាមកម្រិត</span></label>
    </section>
    <section>
      <a class="btn secondary side-wide" id="scan-link" href="scan.html" style="text-align:center;">📷 ស្កេនសន្លឹកចម្លើយ OMR</a>
      <button id="profile-btn" class="secondary side-wide">⚙ ក្បាល / ជើងទំព័រ</button>
    </section>
    <p class="side-tip">ចុច «ទាញយក PDF» ដើម្បីរក្សាទុកឯកសារ PDF ភ្លាមៗ (មានក្បាល/ជើងទំព័រ និងលេខទំព័រគ្រប់ទំព័រ)។ ប៊ូតុង 🖨 សម្រាប់បោះពុម្ពផ្ទាល់។</p>
  </details>
</aside>

<main class="paper-stage" id="stage"><div id="sheet"></div></main>
</div>

<script src="js/common.js"></script>
<script src="js/mathtype.js"></script>
<script src="js/docx.js"></script>
<script src="js/omr.js"></script>
<script src="js/paper_pretest.js?v=20261019f"></script>
<script src="js/pdfexport.js"></script>
<script src="js/paper.js?v=20261019f"></script>
</body>
</html>
