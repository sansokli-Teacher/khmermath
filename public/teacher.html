<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>គ្រូបង្រៀន — Exam Khmer</title>
<link rel="stylesheet" href="css/app.css">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<script src="js/xlsx.full.min.js"></script>
</head>
<body>

<div id="view-setup" class="auth-screen" hidden>
  <div class="auth-card" style="text-align:left;">
    <div class="brand-mark">∑</div>
    <h2>បង្កើតគណនីគ្រូ (ដំណាក់កាលទី ១)</h2>
    <p class="muted">នេះធ្វើតែម្តងប៉ុណ្ណោះ។ សូមជ្រើសរើសឈ្មោះអ្នកប្រើប្រាស់ និងពាក្យសម្ងាត់សម្រាប់គ្រូ។</p>
    <label>ឈ្មោះអ្នកប្រើប្រាស់</label>
    <input type="text" id="setup-username" autocomplete="off">
    <label>ពាក្យសម្ងាត់ (យ៉ាងតិច ៦ តួ)</label>
    <input type="password" id="setup-password">
    <div class="row" style="margin-top:14px;"><button id="setup-submit">បង្កើតគណនី</button></div>
  </div>
</div>

<div id="view-login" class="auth-screen" hidden>
  <div class="auth-card" style="text-align:left;">
    <div class="brand-mark">∑</div>
    <h2>ចូលគណនីគ្រូ</h2>
    <label>ឈ្មោះអ្នកប្រើប្រាស់</label>
    <input type="text" id="login-username" autocomplete="username">
    <label>ពាក្យសម្ងាត់</label>
    <input type="password" id="login-password" autocomplete="current-password">
    <div class="row" style="margin-top:14px;"><button id="login-submit">ចូល</button></div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:center;">
      <a href="signup.html">✨ មិនទាន់មានគណនី? បង្កើតគណនីសាកល្បង</a>
    </div>
  </div>
</div>

<div id="view-dashboard" class="wrap" hidden>
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div>
      <h1 style="margin:0;">ផ្ទាំងគ្រូ</h1>
      <div id="teacher-username-badge" class="muted" style="font-size:13px;margin-top:2px;"></div>
    </div>
    <div class="row" style="gap:8px;">
      <button class="secondary btn-sm" id="change-pwd-btn">🔑 ប្តូរពាក្យសម្ងាត់</button>
      <button class="secondary btn-sm" id="logout-btn">ចាកចេញ</button>
    </div>
  </div>

  <div class="tabs">
    <button data-tab="classes" class="active">ថ្នាក់ និងសិស្ស</button>
    <button data-tab="tests">តេស្ត</button>
    <button data-tab="schedule">កំណត់ពេលប្រឡង</button>
    <button data-tab="grading">ដាក់ពិន្ទុ &amp; បង្ហាញលទ្ធផល</button>
    <button data-tab="year">ពិន្ទុប្រចាំឆ្នាំ</button>
    <button data-tab="overview">សង្ខេបគ្រប់ថ្នាក់</button>
    <button data-tab="teachers">👥 គ្រូបង្រៀន</button>
  </div>

  <div id="tab-classes"></div>
  <div id="tab-tests" hidden></div>
  <div id="tab-schedule" hidden></div>
  <div id="tab-grading" hidden></div>
  <div id="tab-year" hidden></div>
  <div id="tab-overview" hidden></div>
  <div id="tab-teachers" hidden></div>
</div>

<script src="js/common.js"></script>
<script src="js/mathtype.js"></script>
<script src="js/teacher.js"></script>
<script src="js/year.js"></script>
<script src="js/team.js"></script>
</body>
</html>
