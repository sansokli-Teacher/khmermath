<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>បង្កើតគណនីគ្រូ</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/interface.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#285b55">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card" id="card" style="text-align:left;">
    <div class="brand-mark" style="margin-left:auto;margin-right:auto;">∑</div>
    <h1 style="text-align:center;">បង្កើតគណនីគ្រូបង្រៀន</h1>
    <p class="muted" style="text-align:center;">គណនីថ្មីចាប់ផ្តើមជា <b>«សាកល្បង»</b> — អ្នកអាចមើលតេស្តគំរូ និងរបៀបដំណើរការ។ ដើម្បីបង្កើតថ្នាក់ តេស្ត និងរៀបចំប្រឡងពិតប្រាកដ សូមដោះសោដោយកូដពីម្ចាស់ប្រព័ន្ធ។</p>
    <label for="f-name">ឈ្មោះរបស់អ្នក</label>
    <input type="text" id="f-name" placeholder="ឧ. គ្រូ សុភា" autocomplete="name">
    <label for="f-user">ឈ្មោះអ្នកប្រើ (សម្រាប់ចូលប្រព័ន្ធ)</label>
    <input type="text" id="f-user" placeholder="ឧ. sopha" autocomplete="username" autocapitalize="none">
    <label for="f-contact">លេខទូរស័ព្ទ ឬ Telegram (មិនចាំបាច់ — ដើម្បីឱ្យម្ចាស់ទាក់ទងអ្នកវិញ)</label>
    <input type="text" id="f-contact" placeholder="ឧ. 012 345 678">
    <label for="f-pass">ពាក្យសម្ងាត់ (យ៉ាងតិច ៦ តួ)</label>
    <input type="password" id="f-pass" autocomplete="new-password">
    <label for="f-pass2">វាយពាក្យសម្ងាត់ម្តងទៀត</label>
    <input type="password" id="f-pass2" autocomplete="new-password">
    <button id="f-go" class="btn-block" style="margin-top:16px;">បង្កើតគណនី</button>
    <a href="teacher.html" class="back-link" style="display:block;text-align:center;">មានគណនីរួចហើយ? ចូលប្រើ</a>
  </div>
</div>
<script src="js/common.js"></script>
<script>
const { api, showError } = Exam;
const card = document.getElementById('card');
document.getElementById('f-go').addEventListener('click', async () => {
  const pass = document.getElementById('f-pass').value, pass2 = document.getElementById('f-pass2').value;
  if (pass.length < 6) return showError(card, 'ពាក្យសម្ងាត់ត្រូវមានយ៉ាងតិច ៦ តួអក្សរ។');
  if (pass !== pass2) return showError(card, 'ពាក្យសម្ងាត់ទាំងពីរមិនដូចគ្នាទេ។');
  try {
    await api('/api/teacher/signup', { method: 'POST', body: {
      display_name: document.getElementById('f-name').value.trim(), username: document.getElementById('f-user').value.trim(),
      contact: document.getElementById('f-contact').value.trim(), password: pass,
    } });
    location.href = 'teacher.html';
  } catch (e) { showError(card, e.message); }
});
</script>
</body>
</html>
