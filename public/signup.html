<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>បង្កើតគណនីគ្រូ</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/interface.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#285b55">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card" id="card" style="text-align:left;">
    <div class="brand-mark" style="margin-left:auto;margin-right:auto;">∑</div>
    <h1 style="text-align:center;">សាកល្បងឥតគិតថ្លៃ</h1>
    <p class="muted" style="text-align:center;">បង្កើតគណនីក្នុង ៣០ វិនាទី — បង្កើតថ្នាក់ ១ សិស្ស ១០នាក់ តេស្ត ២ ហើយរៀបចំប្រឡងសាកល្បងបានភ្លាម។ ចង់បានមុខងារពេញលេញ ៖ <b>១ ខែ $2.99</b> ឬ <b>១ ឆ្នាំ <s>$30</s> $15</b>។</p>
    <label for="f-name">ឈ្មោះរបស់អ្នក</label>
    <input type="text" id="f-name" placeholder="ឧ. គ្រូ សុភា" autocomplete="name">
    <label for="f-user">ឈ្មោះសម្រាប់ចូល <span class="muted">(ប្រើលេខទូរស័ព្ទក៏បាន)</span></label>
    <input type="text" id="f-user" placeholder="ឧ. 012345678 ឬ sopha" autocomplete="username" autocapitalize="none" inputmode="text">
    <label for="f-pass">ពាក្យសម្ងាត់ <span class="muted">(យ៉ាងតិច ៦ តួ)</span></label>
    <div class="pw-wrap"><input type="password" id="f-pass" autocomplete="new-password" style="width:100%;padding-right:42px;"><button type="button" id="f-eye" aria-label="បង្ហាញពាក្យសម្ងាត់">👁</button></div>
    <button id="f-go" class="btn-block" style="margin-top:16px;">បង្កើតគណនី — សាកល្បងឥតគិតថ្លៃ</button>
    <a href="teacher.html" class="back-link" style="display:block;text-align:center;">មានគណនីរួចហើយ? ចូលប្រើ</a>
  </div>
</div>
<script src="js/common.js"></script>
<script>
const { api, showError } = Exam;
const card = document.getElementById('card');
const pass = document.getElementById('f-pass');
document.getElementById('f-eye').addEventListener('click', () => { pass.type = pass.type === 'password' ? 'text' : 'password'; });
// Khmer / spaces / capitals in the login name are the usual stumbling block: clean it up instead of refusing.
const cleanUser = (v) => v.trim().toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9_.\-]/g, '');
async function go() {
  const name = document.getElementById('f-name').value.trim();
  const raw = document.getElementById('f-user').value;
  const user = cleanUser(raw);
  if (!name) return showError(card, 'សូមបញ្ចូលឈ្មោះរបស់អ្នក។');
  if (user.length < 3) return showError(card, 'ឈ្មោះសម្រាប់ចូលត្រូវមានយ៉ាងតិច ៣ តួ — ប្រើអក្សរឡាតាំង ឬលេខ (ឧ. លេខទូរស័ព្ទ)។');
  if (pass.value.length < 6) return showError(card, 'ពាក្យសម្ងាត់ត្រូវមានយ៉ាងតិច ៦ តួអក្សរ។');
  const btn = document.getElementById('f-go'); btn.disabled = true;
  try {
    await api('/api/teacher/signup', { method: 'POST', body: { display_name: name, username: user, contact: /^[0-9+ ]{8,}$/.test(raw.trim()) ? raw.trim() : '', password: pass.value } });
    location.href = 'teacher.html';
  } catch (e) { btn.disabled = false; showError(card, e.message); }
}
document.getElementById('f-go').addEventListener('click', go);
for (const id of ['f-name', 'f-user', 'f-pass']) document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
