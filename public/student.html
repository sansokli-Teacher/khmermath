<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>សិស្ស — Exam Khmer</title>
<link rel="stylesheet" href="css/app.css">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
</head>
<body>

<div id="view-login" class="wrap" hidden>
  <div class="card" style="margin-top:40px;">
    <h2>ចូលធ្វើតេស្ត</h2>
    <label>លេខសម្គាល់សិស្ស</label>
    <input type="text" id="login-id" autocomplete="off" inputmode="numeric">
    <label>កូដសម្ងាត់ (PIN)</label>
    <input type="text" id="login-pin" autocomplete="off" inputmode="numeric">
    <div class="row" style="margin-top:14px;"><button id="login-submit" style="width:100%">ចូល</button></div>
  </div>
</div>

<div id="view-status" class="wrap center-screen" style="flex-direction:column" hidden></div>

<div id="view-test" hidden>
  <div class="timer" id="timer-bar">
    <span id="timer-title"></span>
    <span id="timer-clock"></span>
  </div>
  <div class="wrap">
    <div class="question-nav" id="question-nav"></div>
    <div id="question-area"></div>
    <div class="row" style="justify-content:center;margin-top:10px;">
      <button id="submit-btn">បញ្ជូនចម្លើយ</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/student.js"></script>
</body>
</html>
