<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>សិស្ស — ប្រព័ន្ធប្រឡង</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2260d6">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
</head>
<body class="student-body">

<!-- 1. Sign in with the student ID only -->
<div id="view-login" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="brand-mark">∑</div>
    <h1>ប្រព័ន្ធប្រឡងគណិតវិទ្យា</h1>
    <p class="muted">សូមបញ្ចូលអត្តលេខរបស់អ្នក ដើម្បីមើលលទ្ធផល និងការប្រឡងខាងមុខ។</p>
    <label for="login-id">អត្តលេខសិស្ស</label>
    <input type="text" id="login-id" class="big-input" autocomplete="off" inputmode="numeric" placeholder="ឧ. 0109293">
    <div id="dob-wrap" hidden>
      <label for="login-dob">ថ្ងៃខែឆ្នាំកំណើត (ឧ. 15/03/2012)</label>
      <input type="text" id="login-dob" class="big-input" autocomplete="off" inputmode="numeric" placeholder="ថ្ងៃ/ខែ/ឆ្នាំ">
    </div>
    <button id="login-submit" class="btn-block">ចូល</button>
    <a href="index.html" class="back-link">← ទំព័រដើម</a>
  </div>
</div>

<!-- 2. Home: upcoming tests + past scores -->
<div id="view-home" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <div>
        <div class="topbar-name" id="home-name"></div>
        <div class="topbar-sub" id="home-sub"></div>
      </div>
      <button class="secondary btn-sm" id="home-logout">ចាកចេញ</button>
    </div>
  </header>
  <main class="wrap" id="home-body"></main>
</div>

<!-- 3. Waiting for the start time -->
<div id="view-wait" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="wait-icon">⏳</div>
    <h1 id="wait-title"></h1>
    <p class="muted">PIN ត្រឹមត្រូវ។ សូមរង់ចាំដល់ម៉ោងចាប់ផ្តើម — ការប្រឡងនឹងបើកដោយស្វ័យប្រវត្តិ។</p>
    <div class="countdown" id="wait-count">--:--:--</div>
    <div class="muted" id="wait-start"></div>
    <button class="secondary btn-block" id="wait-cancel" style="margin-top:18px;">← ត្រឡប់ក្រោយ</button>
  </div>
</div>

<!-- 4. Taking the test -->
<div id="view-test" hidden>
  <div id="preview-banner" class="preview-banner" hidden>👁 របៀបមើលជាសិស្ស — ចម្លើយមិនត្រូវបានរក្សាទុក ឬបញ្ជូនទេ · <a href="teacher.html">← ត្រឡប់ទៅផ្ទាំងគ្រូ</a></div>
  <div class="timer" id="timer-bar">
    <div style="min-width:0;">
      <div id="timer-title" class="timer-title"></div>
      <div style="display:flex;gap:10px;align-items:center;"><span id="student-badge" class="muted" style="font-size:12px;"></span><span id="save-status" class="save-status">✓ រក្សាទុកហើយ</span></div>
    </div>
    <div id="timer-clock" class="timer-clock"></div>
  </div>
  <div class="wrap">
    <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="question-nav" id="question-nav"></div>
    <div id="question-area"></div>
    <div class="row" style="justify-content:center;margin-top:10px;">
      <button id="submit-btn" class="good">បញ្ជូនចម្លើយ ✓</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/mathtype.js"></script>
<script src="js/student.js"></script>
</body>
</html>
