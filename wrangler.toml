# Exam Khmer — monthly classroom MCQ test system.
# Deploy with: npx wrangler deploy
name = "exam-khmer"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "exam.khmermath.org", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/teacher", "/teacher.html"]

[[d1_databases]]
binding = "DB"
database_name = "exam-khmer"
database_id = "e2c4bb28-e80c-430d-bbd5-36af9696563e"

# Weekly backup of the whole system (see src/lib/backup.js)
[triggers]
crons = ["0 20 * * SUN", "*/10 * * * *"]

# Phone remote for the team game: one Durable Object per room (see src/remote_do.js)
[[durable_objects.bindings]]
name = "REMOTE"
class_name = "RemoteRoom"

[[migrations]]
tag = "v1-remote-rooms"
new_sqlite_classes = ["RemoteRoom"]
